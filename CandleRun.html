<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#04070b" />
<meta name="description" content="CandleRun — a synthetic, practice trading game. Read the tape, go long or short, manage your risk, and climb the funded-warrior ladder. Not real money. Built for fun." />
<meta name="apple-mobile-web-app-title" content="CandleRun" />
<meta property="og:title" content="CandleRun V12.1 — Trading Simulator Game" />
<meta property="og:description" content="Synthetic practice trading. Long/short the tape, survive the chaos, climb the ladder. No real money." />
<meta property="og:type" content="website" />
<title>CandleRun V12.1 — Trading Simulator Game</title>
<style>
/* ============================================================
   CANDLERUN — DESIGN SYSTEM
   Dark luxury / neon emerald / esports trading terminal
   ============================================================ */
:root{
  --bg:#04070b;
  --bg2:#070b11;
  --panel:#0a0f16;
  --panel2:#0c121b;
  --card:#0b1219;
  --card-hi:#0e1822;
  --stroke:rgba(120,255,205,.10);
  --stroke-2:rgba(160,255,220,.16);
  --grid:rgba(140,200,180,.06);
  --txt:#e9f2ef;
  --txt-2:#9aa7ad;
  --txt-3:#67737a;
  --green:#19e98c;
  --green-2:#0fd17e;
  --green-soft:#1ec98a;
  --teal:#2fe6c8;
  --teal-dim:#1aa78f;
  --red:#ff4d5e;
  --red-2:#ff6470;
  --amber:#ffb13c;
  --gold:#ffd24a;
  --silver:#cfe0e6;
  --bronze:#e0945a;
  --blue:#3aa0ff;
  --glow:0 0 22px rgba(25,233,140,.45);
  --glow-soft:0 0 14px rgba(25,233,140,.22);
  --r:18px;
  --r-sm:13px;
  --r-lg:24px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --navh:74px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--txt);
  overflow:hidden;
  position:fixed;width:100%;height:100%;
  -webkit-font-smoothing:antialiased;
  letter-spacing:.1px;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.mono{font-family:var(--mono);}
::-webkit-scrollbar{width:0;height:0;display:none;}
*{scrollbar-width:none;}

/* atmospheric background */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(25,233,140,.10), transparent 55%),
    radial-gradient(90% 60% at 100% 0%, rgba(47,230,200,.06), transparent 50%),
    radial-gradient(80% 60% at 0% 100%, rgba(25,233,140,.05), transparent 55%),
    var(--bg);
}
#bgfx:after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:46px 46px;mask:radial-gradient(120% 90% at 50% 0%,#000 20%,transparent 75%);}

/* APP SHELL */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;}
.screen{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-top) + 8px) 14px calc(var(--navh) + var(--safe-bot) + 18px);}
.screen.active{display:block;animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ERROR BANNER */
#error-banner{position:fixed;top:0;left:0;right:0;z-index:9999;display:none;
  background:linear-gradient(90deg,#3a0d12,#5a1119);color:#ffd9dc;
  padding:calc(var(--safe-top) + 10px) 16px 10px;font-size:12.5px;border-bottom:1px solid #ff4d5e;
  box-shadow:0 6px 24px rgba(0,0,0,.5);}
#error-banner b{color:#ff8a93;}
#error-banner .x{position:absolute;right:14px;top:calc(var(--safe-top) + 8px);font-size:18px;color:#ffb3b8;padding:4px 8px;}

/* ---------- TOP BAR ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px;}
.logo{display:flex;align-items:center;gap:9px;}
.logo .mark{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 0 8px rgba(25,233,140,.6));}
.logo .word{font-weight:800;font-style:italic;font-size:18px;line-height:.92;letter-spacing:.5px;}
.logo .word .c{color:#fff;display:block;}
.logo .word .r{color:var(--green);display:block;}
.topicons{display:flex;align-items:center;gap:7px;}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--stroke);
  background:rgba(12,18,26,.6);display:flex;align-items:center;justify-content:center;position:relative;
  backdrop-filter:blur(8px);}
.iconbtn svg{width:18px;height:18px;stroke:var(--txt-2);}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:var(--glow-soft);}
.iconbtn .dot.red{background:var(--red);box-shadow:0 0 8px rgba(255,77,94,.6);}

/* ---------- CARDS ---------- */
.card{background:linear-gradient(168deg,var(--card-hi),var(--card));border:1px solid var(--stroke);
  border-radius:var(--r);position:relative;overflow:hidden;}
.card.glow{box-shadow:0 0 0 1px rgba(25,233,140,.12),0 8px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.03);}
.label{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-3);font-weight:700;}
.muted{color:var(--txt-2);}
.pos{color:var(--green);}
.neg{color:var(--red);}
.big{font-weight:800;font-size:22px;letter-spacing:.2px;}
.divider{height:1px;background:var(--stroke);margin:10px 0;}

/* ---------- HERO STAT STRIP (home top) ---------- */
.statstrip{display:flex;gap:8px;padding:11px 12px;align-items:stretch;}
.statstrip .seg{flex:1;min-width:0;}
.statstrip .vsep{width:1px;background:var(--stroke);align-self:stretch;}
.rankbadge{display:flex;align-items:center;gap:9px;}
.rankbadge .shield{width:40px;height:40px;flex:0 0 auto;filter:drop-shadow(0 0 6px rgba(47,230,200,.5));}
.rankbadge .nm{font-weight:800;font-size:15px;color:var(--teal);line-height:1;}
.rankbadge .sub{font-size:10px;color:var(--txt-3);margin-top:3px;}
.flameval{font-weight:800;font-size:20px;display:flex;align-items:baseline;gap:3px;}
.flameval .u{font-size:11px;color:var(--txt-3);font-weight:600;}
.spark{height:24px;width:100%;display:block;margin-top:4px;}
.xpbar{height:5px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:6px;}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--teal));box-shadow:var(--glow-soft);border-radius:4px;}

/* balance card */
.balcard{display:flex;gap:10px;padding:13px 14px;align-items:center;}
.balcard .seg{flex:1;min-width:0;}
.balcard .v{font-weight:800;font-size:19px;}
.warriorbar{position:relative;height:10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);overflow:hidden;margin-top:6px;}
.warriorbar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--green-2),var(--green));box-shadow:0 0 14px rgba(25,233,140,.5);border-radius:14px;transition:width .3s ease;max-width:100%;}
.warriorbar .mk{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:700;color:#021;mix-blend-mode:screen;}
.msrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;}
.ms-title{font-size:10px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);}
.ms-target{font-size:10px;font-weight:800;color:var(--txt-2);}

/* ---------- TICKER ROW ---------- */
.ticker{display:flex;gap:8px;overflow-x:auto;padding:2px 0 2px;scroll-snap-type:x proximity;}
.tk{flex:0 0 auto;min-width:138px;background:linear-gradient(168deg,var(--card-hi),var(--card));
  border:1px solid var(--stroke);border-radius:14px;padding:9px 11px;display:flex;align-items:center;gap:9px;scroll-snap-align:start;}
.tk.active{border-color:rgba(25,233,140,.5);box-shadow:var(--glow-soft);background:linear-gradient(168deg,#0f1f1b,#0b1219);}
.tk .ic{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#03110c;}
.tk .nm{font-weight:700;font-size:12.5px;line-height:1;}
.tk .pr{font-size:11px;margin-top:3px;}
.tk-add{flex:0 0 auto;width:46px;border-radius:14px;border:1px dashed var(--stroke-2);background:rgba(12,18,26,.4);
  display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--txt-2);}

/* ---------- CHART CARD ---------- */
.chartcard{margin-top:11px;padding:0;}
.chart-head{display:flex;align-items:center;gap:9px;padding:11px 12px 8px;flex-wrap:wrap;}
.chart-head .as-ic{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#03110c;}
.chart-head .as-nm{font-weight:800;font-size:16px;line-height:1;}
.chart-head .as-sub{font-size:10.5px;color:var(--txt-3);margin-top:2px;}
.star{margin-left:2px;font-size:15px;cursor:pointer;}
.tfwrap{display:flex;gap:3px;margin-left:auto;background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:11px;padding:3px;}
.tf{padding:5px 8px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--txt-2);min-width:30px;text-align:center;}
.tf.active{background:linear-gradient(180deg,#13241f,#0d1a16);color:var(--green);box-shadow:inset 0 0 0 1px rgba(25,233,140,.35);}
.ohlc{display:flex;gap:11px;padding:0 12px 7px;font-size:11px;flex-wrap:wrap;}
.ohlc .k{color:var(--txt-3);}
.ohlc b{font-weight:700;}
#chart-host{position:relative;width:100%;height:330px;touch-action:none;cursor:grab;}
@media(max-width:430px){#chart-host{height:268px;}.chart-head{padding:10px 11px 7px;}.ohlc{padding:0 11px 6px;}.orderwrap{margin-top:9px;gap:8px;}.tradebtns{margin-top:8px;gap:8px;}.bigbtn{padding:13px;font-size:15px;}.bigbtn.long,.bigbtn.short{padding-bottom:22px;}.two{margin-top:10px;gap:8px;}}
#chart-svg{display:block;width:100%;height:100%;}
.chart-empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--txt-3);font-size:13px;}
.chart-badge{position:absolute;left:10px;top:8px;font-size:10px;color:var(--txt-3);background:rgba(8,12,16,.6);
  border:1px solid var(--stroke);border-radius:8px;padding:3px 7px;display:flex;align-items:center;gap:5px;}
.chart-badge .rg{color:var(--teal);font-weight:700;text-transform:capitalize;}

/* ---------- TWO COLUMN PANELS ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px;}
@media(max-width:430px){.two{grid-template-columns:1fr;}}
.panel{padding:12px;}
.panel h4{margin:0 0 9px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-2);display:flex;justify-content:space-between;align-items:center;font-weight:700;}
.news-item{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--stroke);}
.news-item:last-child{border-bottom:none;}
.news-item .tm{font-size:9.5px;color:var(--txt-3);width:30px;flex:0 0 auto;padding-top:1px;}
.news-item .tx{flex:1;font-size:11.5px;line-height:1.35;color:var(--txt);}
.news-item .imp{font-size:9px;font-weight:800;letter-spacing:.5px;padding-top:1px;}
.imp.high{color:var(--red);}.imp.medium{color:var(--amber);}.imp.low{color:var(--green);}
.wl-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--stroke);font-size:12px;}
.wl-row:last-child{border-bottom:none;}
.wl-row .ic{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;color:#03110c;}
.wl-row .sym{font-weight:700;flex:1;}
.wl-row .pr{width:74px;text-align:right;}
.wl-row .ch{width:58px;text-align:right;font-size:11px;}
.wl-row .st{width:18px;text-align:center;color:var(--txt-3);}
.wl-row .st.on{color:var(--green);}
.linkrow{text-align:right;color:var(--green);font-size:11px;font-weight:700;margin-top:8px;}

/* ---------- ORDER / TRADE PANEL ---------- */
.orderwrap{margin-top:8px;display:grid;grid-template-columns:1.05fr 1fr;gap:9px;}
@media(max-width:460px){.orderwrap{grid-template-columns:1fr;}}
.sizecard{padding:10px 11px;display:flex;flex-direction:column;align-items:center;}
.gauge{position:relative;width:120px;height:78px;margin-top:2px;}
.gauge svg{width:120px;height:78px;}
.gauge .gv{position:absolute;left:0;right:0;top:30px;text-align:center;font-weight:800;font-size:22px;}
.gauge .gl{position:absolute;left:0;right:0;top:57px;text-align:center;font-size:10px;color:var(--txt-3);}
.sizebtns{display:flex;gap:6px;margin-top:8px;width:100%;}
.sizebtns button{flex:1;padding:7px 0;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);font-size:11.5px;font-weight:700;color:var(--txt-2);}
.sizebtns button.active{color:var(--green);border-color:rgba(25,233,140,.4);background:rgba(25,233,140,.08);}
.stepper{display:flex;align-items:center;gap:8px;margin-top:8px;width:100%;}
.stepper button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);font-size:18px;font-weight:700;color:var(--txt);}
.stepper .val{flex:1;text-align:center;font-weight:800;font-size:15px;}
.riskline{margin-top:9px;width:100%;display:flex;justify-content:space-between;font-size:10.5px;}
.metricrows{padding:10px 11px;display:flex;flex-direction:column;gap:8px;}
.mrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;}
.mrow .k{color:var(--txt-3);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;}
.lev-sel{display:flex;gap:4px;}
.lev-sel button{padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.04);border:1px solid var(--stroke);color:var(--txt-2);}
.lev-sel button.active{color:var(--teal);border-color:rgba(47,230,200,.4);background:rgba(47,230,200,.08);}
.margbar{height:6px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;}
.margbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:4px;}

/* trade buttons */
.tradebtns{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
.bigbtn{border-radius:15px;padding:15px;font-weight:800;font-size:16px;letter-spacing:.4px;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;}
.bigbtn .sub{font-size:11px;font-weight:600;opacity:.9;position:absolute;bottom:5px;left:0;right:0;text-align:center;}
.bigbtn.long{background:linear-gradient(180deg,#1ff19a,#10c87a);color:#022016;box-shadow:0 8px 26px rgba(25,233,140,.35);padding-bottom:24px;}
.bigbtn.short{background:linear-gradient(180deg,#ff5f6d,#e23947);color:#2a0508;box-shadow:0 8px 26px rgba(255,77,94,.3);padding-bottom:24px;}
.bigbtn.flat{background:rgba(255,255,255,.05);border:1px solid var(--stroke);color:var(--txt-2);}
.bigbtn:active{transform:translateY(1px) scale(.997);}
.bigbtn.disabled{opacity:.4;pointer-events:none;}
.sltp-toggle{display:flex;gap:8px;margin-top:2px;}
.sltp-toggle button{flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);font-size:12px;font-weight:700;color:var(--txt-2);}
.sltp-toggle button.on{color:var(--green);border-color:rgba(25,233,140,.4);background:rgba(25,233,140,.07);}

/* position banner */
.posbanner{margin-top:11px;padding:11px 13px;display:none;}
.posbanner.show{display:block;}
.posbanner .top{display:flex;align-items:center;justify-content:space-between;}
.posbanner .dirtag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;letter-spacing:.5px;}
.dirtag.long{background:rgba(25,233,140,.14);color:var(--green);}
.dirtag.short{background:rgba(255,77,94,.14);color:var(--red);}
.posbanner .pnlv{font-weight:800;font-size:20px;}
.posgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px;}
.posgrid .c{font-size:12px;}
.posgrid .c .k{font-size:9.5px;color:var(--txt-3);letter-spacing:.6px;text-transform:uppercase;}

/* ---------- CONTROL DECK (speed / run / autoclose) ---------- */
.controldeck{margin-top:8px;display:grid;grid-template-columns:minmax(96px,1fr) 104px minmax(76px,1fr);align-items:center;gap:8px;padding:9px 10px;background:linear-gradient(160deg,rgba(12,21,27,.96),rgba(6,11,18,.98));border-color:rgba(25,233,140,.22);box-shadow:0 12px 28px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.03), inset 0 0 26px rgba(25,233,140,.03);}
.speedwrap{display:flex;align-items:center;justify-content:flex-start;gap:6px;}
.speedwrap .lab{font-size:9.5px;color:var(--txt-3);font-weight:700;letter-spacing:1px;}
.speeds{display:flex;gap:4px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid rgba(150,255,220,.12);border-radius:14px;padding:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.speeds button{padding:7px 9px;border-radius:10px;font-size:11.5px;font-weight:900;color:var(--txt-2);min-width:32px;letter-spacing:.3px;}
.speeds button.active{background:linear-gradient(180deg,rgba(18,41,34,.96),rgba(11,22,18,.98));color:var(--green);box-shadow:0 0 0 1px rgba(25,233,140,.42),0 0 20px rgba(25,233,140,.10), inset 0 1px 0 rgba(255,255,255,.04);}
.runhex{width:104px;height:74px;flex:0 0 auto;margin:0 auto;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;isolation:isolate;border-radius:20px;background:radial-gradient(circle at 50% 35%,rgba(25,233,140,.11),rgba(0,0,0,0) 58%);}
.runhex:before{content:"";position:absolute;inset:8px;border-radius:16px;background:radial-gradient(circle at 50% 35%,rgba(27,255,170,.18),rgba(27,255,170,0) 66%);opacity:.72;filter:blur(11px);z-index:0;}
.runhex .hexbg{position:absolute;inset:2px 6px;z-index:1;}
.runhex .lbl{position:relative;z-index:2;font-weight:900;font-size:17px;color:var(--green);text-shadow:0 0 16px rgba(25,233,140,.30);letter-spacing:.7px;line-height:.98;}
.runhex .substate{position:relative;z-index:2;margin-top:2px;font-size:7.4px;font-weight:900;letter-spacing:1.45px;color:rgba(207,224,230,.70);}
.runhex.paused .lbl{color:var(--green);}
.runhex.running .lbl{color:#02150f;text-shadow:none;}
.runhex.running .substate{color:#8cffc8;}
.runhex:active{transform:translateY(1px) scale(.992);}
.autoclose{display:flex;flex-direction:column;gap:5px;align-items:flex-end;justify-content:center;}
.tog{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;color:var(--txt-2);letter-spacing:.85px;}
.switch{width:42px;height:23px;border-radius:13px;background:rgba(255,255,255,.10);position:relative;transition:.2s;flex:0 0 auto;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}
.switch>i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#85939a;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.3);}
.switch.on{background:linear-gradient(180deg,rgba(25,233,140,.54),rgba(25,233,140,.30));box-shadow:0 0 0 1px rgba(25,233,140,.14),0 0 16px rgba(25,233,140,.13);}
.switch.on>i{left:21px;background:var(--green);box-shadow:0 0 14px rgba(25,233,140,.35);}
.deckrow2{display:flex;gap:8px;margin-top:7px;}
.deckrow2 button{flex:1;padding:12px 10px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid rgba(150,255,220,.10);font-size:12.2px;font-weight:800;color:var(--txt-2);display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02);}
.deckrow2 button svg{width:15px;height:15px;stroke:currentColor;}

.ach .at{font-size:10.5px;font-weight:800;line-height:1.15;}

.journal .jr{padding:11px;border:1px solid var(--stroke);border-radius:13px;margin-bottom:9px;background:rgba(255,255,255,.02);}

.exitchip.sl{background:rgba(255,77,94,.12);color:var(--red);}

/* ---------- BOTTOM NAV ---------- */
#bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;
  padding:8px 8px calc(var(--safe-bot) + 8px);
  background:linear-gradient(180deg,rgba(8,12,17,.55),rgba(6,9,13,.96));

.navbtn.active svg{stroke:var(--green);filter:drop-shadow(0 0 6px rgba(25,233,140,.6));}

/* ---------- MODALS / TOAST ---------- */
#modal-root{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center;}

.scrim{position:absolute;inset:0;background:rgba(2,4,6,.7);backdrop-filter:blur(4px);animation:fade .2s;}
.sheet{position:relative;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;

.sheet .fld{margin-bottom:13px;}

  padding:13px;color:var(--txt);font-size:14px;font-family:inherit;outline:none;}
.sheet input:focus,.sheet textarea:focus{border-color:rgba(25,233,140,.5);}
.sheet textarea{min-height:90px;resize:vertical;}
.sheet .row2{display:flex;gap:9px;}
.sheet .row2>*{flex:1;}
.sheet .btnrow{display:flex;gap:9px;margin-top:8px;}
.sheet .btn{flex:1;padding:14px;border-radius:13px;font-weight:800;font-size:14px;text-align:center;}
.sheet .btn.primary{background:linear-gradient(180deg,#1ff19a,#10c87a);color:#022016;box-shadow:0 6px 20px rgba(25,233,140,.3);}
.sheet .btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--stroke);color:var(--txt-2);}
.sheet .btn.danger{background:linear-gradient(180deg,#ff5f6d,#e23947);color:#fff;}

.blown-emblem{width:80px;height:80px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.3);}
.blown-emblem svg{width:44px;height:44px;stroke:var(--red);}
.adbox{margin:6px 0 14px;padding:14px;border-radius:14px;border:1px dashed var(--stroke-2);background:rgba(255,255,255,.02);text-align:center;}
.adbox .tagline{font-size:10px;color:var(--txt-3);letter-spacing:1px;text-transform:uppercase;font-weight:700;}

#toast{position:fixed;left:50%;bottom:calc(var(--navh) + var(--safe-bot) + 16px);transform:translateX(-50%) translateY(20px);
  z-index:400;background:linear-gradient(180deg,#0e1a15,#0a1117);border:1px solid rgba(25,233,140,.4);
  color:var(--txt);padding:12px 18px;border-radius:13px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;
  transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,.5),var(--glow-soft);max-width:90%;text-align:center;display:flex;align-items:center;gap:9px;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.bad{border-color:rgba(255,77,94,.5);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 14px rgba(255,77,94,.25);}

.flash{position:fixed;inset:0;z-index:150;pointer-events:none;opacity:0;}
.flash.green{background:radial-gradient(circle at center,rgba(25,233,140,.18),transparent 60%);animation:flashfx .6s ease;}
.flash.red{background:radial-gradient(circle at center,rgba(255,77,94,.18),transparent 60%);animation:flashfx .6s ease;}
@keyframes flashfx{0%{opacity:1}100%{opacity:0}}

.hidden{display:none!important;}
.center-col{display:flex;flex-direction:column;align-items:center;}
small.disc{display:block;font-size:9.5px;color:var(--txt-3);text-align:center;margin-top:14px;line-height:1.4;padding:0 10px;}
.demo-banner{font-size:10px;color:var(--amber);background:rgba(255,177,60,.08);border:1px solid rgba(255,177,60,.25);
  border-radius:9px;padding:7px 10px;margin-bottom:10px;text-align:center;font-weight:700;letter-spacing:.3px;}

/* ---------- V2 POLISH: realism mode + market depth ---------- */
.realism-card{margin-top:11px;padding:10px 12px;display:flex;align-items:center;gap:10px;

/* ============================================================

   More glass depth, dopamine glows, and chart-first trading focus.
   ============================================================ */
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.72;background:radial-gradient(80% 42% at 50% 7%,rgba(25,233,140,.13),transparent 56%),radial-gradient(55% 35% at 88% 18%,rgba(47,230,200,.10),transparent 62%),radial-gradient(60% 50% at 12% 80%,rgba(25,233,140,.065),transparent 60%);mix-blend-mode:screen;}

.screen{padding-left:15px;padding-right:15px;}
.card{background:linear-gradient(160deg,rgba(16,28,39,.94),rgba(8,13,19,.98) 54%,rgba(6,10,15,.96)),radial-gradient(80% 70% at 18% 0%,rgba(25,233,140,.055),transparent 58%);border-color:rgba(119,255,204,.145);}

.logo .mark{filter:drop-shadow(0 0 14px rgba(25,233,140,.75));}
.logo .word{letter-spacing:.8px;text-shadow:0 0 18px rgba(25,233,140,.18);}
.iconbtn{background:linear-gradient(160deg,rgba(18,27,37,.86),rgba(7,12,18,.82));border-color:rgba(151,255,220,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 8px 24px rgba(0,0,0,.34);}
.statstrip,.balcard,.realism-card{border-color:rgba(25,233,140,.18);}
.realism-card{background:radial-gradient(80% 110% at 8% 50%,rgba(25,233,140,.18),transparent 46%),linear-gradient(140deg,rgba(12,26,22,.96),rgba(9,14,20,.96) 54%,rgba(26,9,17,.74));box-shadow:0 0 0 1px rgba(25,233,140,.12),0 16px 42px rgba(0,0,0,.42),0 0 32px rgba(25,233,140,.10);}
.realism-card .rt{letter-spacing:2px;text-shadow:0 0 18px rgba(25,233,140,.35);}

.tk{background:linear-gradient(155deg,rgba(16,25,34,.92),rgba(9,14,20,.94));border-color:rgba(144,255,218,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 22px rgba(0,0,0,.24);}
.tk.active{background:linear-gradient(155deg,rgba(18,45,37,.96),rgba(9,17,18,.96));border-color:rgba(25,233,140,.56);box-shadow:0 0 0 1px rgba(25,233,140,.16),0 12px 30px rgba(0,0,0,.35),0 0 24px rgba(25,233,140,.18);}
.chartcard{border-color:rgba(25,233,140,.22);box-shadow:0 0 0 1px rgba(25,233,140,.12),0 16px 44px rgba(0,0,0,.50),0 0 44px rgba(25,233,140,.09),inset 0 1px 0 rgba(255,255,255,.06);}
.chart-head{padding-top:13px;}
#chart-host{background:radial-gradient(90% 72% at 50% 0%,rgba(25,233,140,.075),transparent 58%),linear-gradient(180deg,rgba(3,9,12,.42),rgba(4,8,12,.82));border-top:1px solid rgba(120,255,205,.07);overflow:hidden;touch-action:none;cursor:grab;}
#chart-host:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.58;background-image:linear-gradient(rgba(140,255,215,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(140,255,215,.035) 1px,transparent 1px),radial-gradient(circle at 74% 16%,rgba(25,233,140,.12),transparent 18%);background-size:48px 48px,48px 48px,100% 100%;mask:linear-gradient(180deg,#000 0%,#000 80%,transparent 100%);}
#chart-svg{position:relative;z-index:1;filter:drop-shadow(0 0 6px rgba(25,233,140,.045));}
.chart-badge{background:linear-gradient(160deg,rgba(7,16,19,.82),rgba(7,11,16,.78));border-color:rgba(120,255,205,.18);box-shadow:0 10px 22px rgba(0,0,0,.28),0 0 18px rgba(25,233,140,.08);}
.orderwrap{gap:9px;}.orderwrap .card{border-color:rgba(25,233,140,.18);}.sizecard,.metricrows{background:linear-gradient(158deg,rgba(15,25,33,.95),rgba(6,11,17,.97));}
.gauge svg,.gaugebig svg{filter:drop-shadow(0 0 8px rgba(25,233,140,.28));}
.sizebtns button,.lev-sel button,.sltp-toggle button,.deckrow2 button{box-shadow:inset 0 1px 0 rgba(255,255,255,.04);}
.bigbtn{overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.18);}

@keyframes btnSheen{0%,70%{transform:translateX(-60%) rotate(8deg)}88%,100%{transform:translateX(68%) rotate(8deg)}}
.bigbtn.long{background:linear-gradient(180deg,#28f7a2,#12d886 58%,#0ebc72);box-shadow:0 12px 30px rgba(25,233,140,.34),0 0 24px rgba(25,233,140,.22),inset 0 1px 0 rgba(255,255,255,.20);}
.bigbtn.short{background:linear-gradient(180deg,#ff6877,#f14558 58%,#d92d42);box-shadow:0 12px 30px rgba(255,77,94,.30),0 0 24px rgba(255,77,94,.16),inset 0 1px 0 rgba(255,255,255,.18);}
.controldeck{background:linear-gradient(155deg,rgba(12,22,28,.92),rgba(7,12,18,.96));border-color:rgba(25,233,140,.18);}.runhex .hexbg{filter:drop-shadow(0 0 17px rgba(25,233,140,.32));}

/* ============================================================
   V9 GOAT — new component styling
   ============================================================ */
.flash.amber{background:radial-gradient(circle at center,rgba(255,177,60,.20),transparent 60%);animation:flashfx .6s ease;}
.flash.gold{background:radial-gradient(circle at center,rgba(255,210,74,.28),transparent 62%);animation:flashfx .7s ease;}

/* FX layer: confetti + xp pops + level up */
#fxlayer{position:fixed;inset:0;z-index:600;pointer-events:none;overflow:hidden;}
#fxlayer.go i{position:absolute;top:-14px;border-radius:2px;opacity:0;animation-name:confetti;animation-timing-function:cubic-bezier(.2,.6,.3,1);animation-fill-mode:forwards;}
@keyframes confetti{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translateY(105vh) rotate(420deg)}}
.xppop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:900;font-size:24px;color:var(--gold);text-shadow:0 2px 20px rgba(255,210,74,.6);animation:xpfloat 1.2s ease forwards;}
@keyframes xpfloat{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px) scale(1.05)}}

/* DAILY OBJECTIVES card */
.dailycard{margin-top:11px;padding:11px 13px 9px;}
.dly-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.dly-ttl{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--txt-2);display:flex;align-items:center;gap:6px;}
.dly-count{font-size:11px;font-weight:900;color:var(--teal);background:rgba(47,230,200,.1);border:1px solid rgba(47,230,200,.25);border-radius:999px;padding:2px 9px;}
.dly-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.dly-row+.dly-row{border-top:1px solid rgba(150,255,220,.06);}
.dly-ic{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:rgba(47,230,200,.08);border:1px solid rgba(47,230,200,.16);display:flex;align-items:center;justify-content:center;}
.dly-ic svg{stroke:var(--teal);}
.dly-row.done .dly-ic{background:rgba(25,233,140,.14);border-color:rgba(25,233,140,.4);} .dly-row.done .dly-ic svg{stroke:var(--green);}
.dly-mid{flex:1;min-width:0;}
.dly-nm{font-size:12.5px;font-weight:700;color:var(--txt);}
.dly-chk{color:var(--green);font-weight:900;}
.dly-bar{margin-top:5px;height:5px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;}
.dly-bar i{display:block;height:100%;background:linear-gradient(90deg,#2fe6c8,#19e98c);border-radius:4px;transition:width .4s ease;}
.dly-row.done .dly-bar i{background:linear-gradient(90deg,#19e98c,#8cffc8);}
.dly-pg{font-size:11px;font-weight:800;color:var(--txt-2);white-space:nowrap;min-width:48px;text-align:right;}
.dly-row.done .dly-pg{color:var(--green);}

/* SETUP RADAR card */
.radarcard{margin-top:9px;display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:var(--r);position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 0% 0%,rgba(47,230,200,.12),transparent 55%),linear-gradient(150deg,rgba(13,24,30,.95),rgba(8,13,19,.96));
  border:1px solid rgba(47,230,200,.20);box-shadow:0 10px 28px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.04);}
.rdr-ring{width:46px;height:46px;flex:0 0 auto;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:conic-gradient(#19e98c calc(var(--p)*1%),rgba(255,255,255,.07) 0);position:relative;}
.rdr-ring:before{content:"";position:absolute;inset:4px;border-radius:50%;background:#0a121a;}
.rdr-ring b{position:relative;z-index:1;font-size:14px;font-weight:900;color:#eafff5;line-height:1;}
.rdr-ring span{position:relative;z-index:1;font-size:6.5px;font-weight:900;letter-spacing:1px;color:var(--txt-3);margin-top:1px;}

.rdr-top{display:flex;align-items:center;gap:8px;}

.rdr-bias.pos{color:var(--green);} .rdr-bias.neg{color:var(--red);} .rdr-bias.muted{color:var(--txt-2);}
.rdr-note{font-size:11px;color:var(--txt-2);line-height:1.3;margin-top:3px;}
.rdr-tag{position:absolute;right:11px;top:9px;font-size:7.5px;font-weight:900;letter-spacing:.8px;color:var(--txt-3);text-transform:uppercase;opacity:.7;}

/* BOSS banner */
.bossbanner{margin-top:11px;display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--r);position:relative;overflow:hidden;
  background:radial-gradient(120% 160% at 100% 0%,color-mix(in srgb,var(--bc) 26%,transparent),transparent 55%),linear-gradient(150deg,rgba(20,16,12,.96),rgba(12,10,16,.97));
  border:1px solid color-mix(in srgb,var(--bc) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--bc) 18%,transparent),0 12px 30px rgba(0,0,0,.46),0 0 26px color-mix(in srgb,var(--bc) 24%,transparent);
  animation:bossIn .4s ease;}
@keyframes bossIn{from{opacity:0;transform:translateY(-6px) scale(.99)}to{opacity:1;transform:none}}
.boss-emoji{font-size:26px;flex:0 0 auto;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--bc) 60%,transparent));animation:bossPulse 1.4s ease-in-out infinite;}
@keyframes bossPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.boss-mid{flex:1;min-width:0;}
.boss-nm{font-weight:900;font-size:14px;color:#fff;letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
.boss-live{font-size:8px;font-weight:900;letter-spacing:1px;color:var(--bc);border:1px solid var(--bc);border-radius:4px;padding:1px 5px;animation:liveBlink 1.2s steps(2,end) infinite;}
@keyframes liveBlink{50%{opacity:.35}}
.boss-goal{font-size:11px;color:var(--txt-2);margin-top:2px;}
.boss-bar{margin-top:6px;height:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;}
.boss-bar i{display:block;height:100%;background:var(--bc);border-radius:4px;transition:width .35s linear;box-shadow:0 0 10px var(--bc);}
.boss-left{text-align:center;flex:0 0 auto;}
.boss-left b{display:block;font-size:20px;font-weight:900;color:#fff;line-height:1;}
.boss-left span{font-size:8px;font-weight:800;letter-spacing:.6px;color:var(--txt-3);text-transform:uppercase;}
.boss-btn{color:var(--amber)!important;border-color:rgba(255,177,60,.28)!important;}
.deckrow2 button{padding:11px 6px;font-size:11.5px;gap:5px;}
.deckrow2 button svg{width:14px;height:14px;}

/* compact in-position risk/reward row */
.rrrow{margin-top:11px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px 10px;}
.rr-chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 8px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(150,255,220,.08);min-width:0;}
.rr-chip.stop{border-color:rgba(255,77,94,.22);background:rgba(255,77,94,.05);}
.rr-chip.tp{border-color:rgba(25,233,140,.22);background:rgba(25,233,140,.05);}
.rr-k{font-size:8px;font-weight:900;letter-spacing:.8px;color:var(--txt-3);text-transform:uppercase;}
.rr-chip b{font-size:13px;font-weight:800;}
.rr-chip.stop b{color:#ff909a;} .rr-chip.tp b{color:#87f4c4;}
.draghint2{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:7px;font-size:10.5px;font-weight:700;color:rgba(207,224,230,.72);}
.bigbtn.closebtn{background:linear-gradient(180deg,#ff6877,#e23947);color:#2a0508;font-weight:900;box-shadow:0 10px 26px rgba(255,77,94,.30),inset 0 1px 0 rgba(255,255,255,.2);}
.tradebtns .sltp-toggle button{padding:11px 6px;font-size:12px;}

/* run hex pulse when live */
.runhex.running:after{content:"";position:absolute;inset:-4px;border-radius:22px;border:2px solid rgba(25,233,140,.5);opacity:0;z-index:0;animation:runPulse 1.5s ease-out infinite;}
@keyframes runPulse{0%{opacity:.55;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}

/* TRADE RECAP modal */
.recap{position:relative;}
.recap .rcp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
.rcp-verdict{font-size:12px;font-weight:900;letter-spacing:2px;padding:4px 12px;border-radius:999px;}
.recap.win .rcp-verdict{color:#04140d;background:linear-gradient(180deg,#28f7a2,#10c87a);box-shadow:0 0 18px rgba(25,233,140,.4);}
.recap.loss .rcp-verdict{color:#2a0508;background:linear-gradient(180deg,#ff6877,#e23947);box-shadow:0 0 18px rgba(255,77,94,.34);}
.rcp-sym{display:flex;align-items:center;gap:9px;}
.rcp-sym .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#03110c;}
.rcp-name{font-weight:800;font-size:13px;} .rcp-sub{font-size:10px;color:var(--txt-3);}
.rcp-pnl{font-weight:900;font-size:32px;letter-spacing:.5px;display:flex;align-items:baseline;gap:10px;margin:4px 0 12px;}
.rcp-pnl .rcp-r{font-size:15px;font-weight:800;opacity:.85;}
.rcp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.rcp-cell{background:rgba(255,255,255,.03);border:1px solid var(--stroke);border-radius:11px;padding:7px 9px;display:flex;flex-direction:column;gap:2px;}
.rcp-cell span{font-size:9px;font-weight:800;letter-spacing:.5px;color:var(--txt-3);text-transform:uppercase;}
.rcp-cell b{font-size:12.5px;font-weight:800;color:var(--txt);}
.rcp-exc{display:flex;gap:8px;margin-top:8px;}
.rcp-exc .exc{flex:1;background:rgba(255,255,255,.025);border:1px solid var(--stroke);border-radius:11px;padding:7px 10px;display:flex;align-items:center;justify-content:space-between;}
.rcp-exc .exc span{font-size:10px;color:var(--txt-3);font-weight:700;} .rcp-exc .exc b{font-size:13px;font-weight:800;}
.rcp-foot{display:flex;gap:9px;margin-top:10px;}
.rcp-grade,.rcp-xp{flex:1;border-radius:13px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;}
.rcp-grade{background:color-mix(in srgb,var(--gc) 12%,transparent);border:1px solid color-mix(in srgb,var(--gc) 40%,transparent);}
.rcp-grade span,.rcp-xp span{font-size:9px;font-weight:900;letter-spacing:1px;color:var(--txt-3);}
.rcp-grade b{font-size:24px;font-weight:900;color:var(--gc);line-height:1;}
.rcp-xp{background:rgba(255,210,74,.08);border:1px solid rgba(255,210,74,.28);}
.rcp-xp b{font-size:22px;font-weight:900;color:var(--gold);line-height:1;}
.rcp-lesson{display:flex;align-items:flex-start;gap:8px;margin-top:11px;padding:10px 12px;border-radius:12px;background:rgba(47,230,200,.05);border:1px solid rgba(47,230,200,.15);font-size:12px;line-height:1.4;color:var(--txt);}
.rcp-lesson svg{flex:0 0 auto;margin-top:1px;}

/* practice picker */
.pm-list{display:flex;flex-direction:column;gap:8px;margin:4px 0 6px;}
.pm-row{display:flex;align-items:center;gap:11px;padding:11px;border-radius:13px;background:rgba(255,255,255,.025);border:1px solid var(--stroke);text-align:left;width:100%;}
.pm-row.active{background:rgba(25,233,140,.07);border-color:rgba(25,233,140,.4);}
.pm-ic{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:rgba(47,230,200,.08);border:1px solid rgba(47,230,200,.16);display:flex;align-items:center;justify-content:center;}
.pm-ic svg{stroke:var(--teal);}
.pm-mid{flex:1;min-width:0;} .pm-nm{font-weight:800;font-size:13.5px;} .pm-ds{font-size:10.5px;color:var(--txt-3);margin-top:1px;}
.pm-on{font-size:9px;font-weight:900;letter-spacing:.6px;color:var(--green);border:1px solid rgba(25,233,140,.4);border-radius:999px;padding:3px 8px;flex:0 0 auto;}

@media(max-width:430px){
  .rrrow{gap:5px;padding:8px;} .rr-chip{padding:5px 6px;} .rr-chip b{font-size:12px;}
  .rcp-pnl{font-size:28px;} .radarcard{padding:9px 11px;gap:10px;} .rdr-name{font-size:13px;}
  .deckrow2 button{font-size:10.5px;padding:11px 4px;}
}

/* ============================================================
   V10 — chart focus mode, drag tooltip, floating dock, safe-area
   ============================================================ */
.screen{ padding-top:calc(var(--safe-top) + 18px); }   /* more breathing room under iPhone/preview bars */
.nav-spacer{ height:calc(var(--navh) + var(--safe-bot) + 10px); }

/* slow-mo speed button hint */
.speeds button.slow.active{ color:#9ad8ff; box-shadow:0 0 0 1px rgba(90,209,255,.45),0 0 18px rgba(90,209,255,.12), inset 0 1px 0 rgba(255,255,255,.04); }
.speeds button.tape{ color:#c9b3ff; letter-spacing:.2px; }
.speeds button.tape.active{ color:#d7c6ff; box-shadow:0 0 0 1px rgba(124,92,255,.5),0 0 18px rgba(124,92,255,.16), inset 0 1px 0 rgba(255,255,255,.04); }
.speeds{ flex-wrap:nowrap; }
.speeds button{ min-width:30px; padding:7px 7px; }

/* fullscreen toggle button on the chart */
.chart-fsbtn{ position:absolute; top:8px; right:8px; z-index:5; width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  border-radius:10px; background:rgba(3,10,15,.62); border:1px solid rgba(150,255,220,.14); backdrop-filter:blur(8px); box-shadow:0 6px 18px rgba(0,0,0,.3); }
.chart-fsbtn svg{ width:16px; height:16px; stroke:#bfeede; }
.chart-fsbtn:active{ transform:scale(.94); }

/* live SL/TP drag tooltip */
.chart-drag-tip{ position:absolute; left:10px; z-index:6; transform:translateY(-50%); pointer-events:none; opacity:0; transition:opacity .12s ease;
  display:flex; flex-direction:column; gap:1px; padding:6px 10px; border-radius:11px; background:rgba(5,11,16,.92); border:1px solid rgba(150,255,220,.3); box-shadow:0 10px 26px rgba(0,0,0,.45); }
.chart-drag-tip.show{ opacity:1; }
.chart-drag-tip b{ font-size:12.5px; font-weight:900; font-family:ui-monospace,monospace; letter-spacing:.2px; }
.chart-drag-tip i{ font-size:10px; font-style:normal; color:var(--txt-2); font-weight:700; }

/* V11: tiny on-chart P&L pill (normal mode) — never blocks candles */
.chart-pnlpill{ position:absolute; left:8px; top:8px; z-index:6; display:none; align-items:center; gap:6px;
  padding:5px 9px; border-radius:999px; background:rgba(4,10,15,.7); backdrop-filter:blur(8px);
  border:1px solid rgba(150,255,220,.14); box-shadow:0 4px 14px rgba(0,0,0,.32); transition:all .25s ease; }
#chart-host.has-pos .chart-pnlpill{ display:flex; }
.chart-pnlpill .pp-dir{ font-size:10px; font-weight:900; }
.chart-pnlpill .pp-dir.long{ color:var(--green);} .chart-pnlpill .pp-dir.short{ color:#ff8a96; }
.chart-pnlpill.mini{ gap:0; padding:4px 8px; }
.chart-pnlpill.mini .cd-r, .chart-pnlpill.mini .pp-dir{ display:none; }
.chart-pnlpill:active{ transform:scale(.96); }
#chart-host.has-pos .chart-zoomtag, body.fs-chart .chart-zoomtag{ display:none; }

/* shared dock chip styles (reused by fullscreen dock) */
.cd-dir{ font-size:10px; font-weight:900; letter-spacing:.4px; padding:3px 8px; border-radius:999px; flex:0 0 auto; }
.cd-dir.long{ color:var(--green); background:rgba(25,233,140,.12); border:1px solid rgba(25,233,140,.4); }
.cd-dir.short{ color:#ff8a96; background:rgba(255,77,94,.12); border:1px solid rgba(255,77,94,.4); }
.cd-pnl{ font-size:15px; font-weight:900; font-family:ui-monospace,monospace; }
.cd-r{ font-size:11px; font-weight:800; opacity:.9; }
.cd-pnl.pos,.cd-r.pos{ color:var(--green); } .cd-pnl.neg,.cd-r.neg{ color:#ff6b78; }
.cd-btn{ padding:9px 13px; min-height:38px; border-radius:11px; font-size:12px; font-weight:800; color:var(--txt-2); background:rgba(255,255,255,.06); border:1px solid var(--stroke); }
.cd-btn.be{ color:#9ad8ff; border-color:rgba(90,209,255,.35); }
.cd-btn.close{ color:#2a0508; background:linear-gradient(180deg,#ff6877,#e23947); border:none; font-weight:900; box-shadow:0 6px 16px rgba(255,77,94,.32); }

/* fullscreen-only bottom dock */
.fs-dock{ display:none; }
.fd-mk{ font-size:11px; color:var(--txt-3); font-weight:700; }

/* ---- FULLSCREEN FOCUS MODE ---- */
body.fs-chart{ overflow:hidden; }
body.fs-chart #bottomnav{ display:none; }
body.fs-chart .chart-pnlpill{ display:none; }   /* fullscreen uses the bottom dock instead */
body.fs-chart .chartcard{ position:fixed; inset:0; z-index:300; margin:0; border:0; border-radius:0;
  height:100vh; height:100dvh; display:flex; flex-direction:column;
  padding-top:var(--safe-top); padding-bottom:var(--safe-bot);
  background:radial-gradient(90% 50% at 50% 0%,rgba(25,233,140,.07),transparent 60%),#070b10; }
body.fs-chart .chartcard .chart-head{ flex:0 0 auto; }
body.fs-chart .chartcard .ohlc{ flex:0 0 auto; }
body.fs-chart #chart-host{ flex:1 1 auto; height:auto !important; }
body.fs-chart .chart-uxbar{ display:none; }
body.fs-chart .fs-dock{ position:absolute; left:6px; right:6px; bottom:6px; z-index:8; display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  padding:8px 10px; border-radius:14px; background:rgba(4,10,15,.82); backdrop-filter:blur(12px); border:1px solid rgba(150,255,220,.14); box-shadow:0 10px 28px rgba(0,0,0,.42); }
body.fs-chart .fs-dock .cd-btn{ margin-left:auto; }
body.fs-chart .fs-dock .cd-btn + .cd-btn{ margin-left:6px; }
body.fs-chart .fs-dock .fsx{ min-width:40px; padding:9px 10px; color:#cfe6ec; }
body.fs-chart .fs-dock .fsx svg{ width:16px; height:16px; stroke:currentColor; vertical-align:middle; }
.fsd-buy,.fsd-sell{ flex:1; min-height:42px; border-radius:12px; font-size:14px; font-weight:900; border:none; }
.fsd-buy{ color:#04140d; background:linear-gradient(180deg,#28f7a2,#10c87a); box-shadow:0 6px 16px rgba(25,233,140,.3); }
.fsd-sell{ color:#2a0508; background:linear-gradient(180deg,#ff6877,#e23947); box-shadow:0 6px 16px rgba(255,77,94,.3); }
.fsd-info{ flex-basis:100%; order:3; text-align:center; font-size:10.5px; color:var(--txt-3); font-weight:700; }

/* ---- V11 collapsible Setup Radar chip ---- */
.radarchip{ margin-top:9px; border-radius:13px; background:rgba(255,255,255,.025); border:1px solid var(--stroke); overflow:hidden; }
.rc-head{ width:100%; display:flex; align-items:center; gap:7px; padding:10px 12px; font-size:12px; font-weight:800; color:var(--txt); background:none; border:none; text-align:left; }
.rc-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; background:var(--txt-3); }
.rc-dot.pos{ background:var(--green); box-shadow:0 0 8px rgba(25,233,140,.6);} .rc-dot.neg{ background:#ff6b78; box-shadow:0 0 8px rgba(255,77,94,.5);} .rc-dot.muted{ background:#7c8a93; }
.rc-head b{ font-family:ui-monospace,monospace; font-size:13px; }
.rc-conf{ font-size:8.5px; letter-spacing:.6px; color:var(--txt-3); font-weight:800; }
.rc-sep{ color:var(--txt-3); opacity:.5; }
.rc-head .rdr-bias{ font-size:10px; font-weight:900; letter-spacing:.4px; }
.rc-head .rdr-bias.pos{ color:var(--green);} .rc-head .rdr-bias.neg{ color:#ff8a96;} .rc-head .rdr-bias.muted{ color:var(--txt-3); }
.rc-head .rdr-name{ font-size:11.5px; color:var(--txt-2); font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rc-caret{ color:var(--txt-3); font-size:11px; flex:0 0 auto; }
.rc-body{ max-height:0; opacity:0; padding:0 12px; transition:all .22s ease; }
.radarchip.open .rc-body{ max-height:120px; opacity:1; padding:0 12px 11px; }
.rc-body .rdr-note{ font-size:11.5px; color:var(--txt-2); line-height:1.45; }
.rc-body .rdr-tag{ display:inline-block; margin-top:7px; font-size:9px; letter-spacing:.5px; text-transform:uppercase; color:var(--txt-3); font-weight:800; }

/* ---- V11 leaderboard categories ---- */
.lb-cats{ display:flex; gap:7px; margin:0 2px 8px; }
.lb-cats button{ flex:1; padding:10px 8px; border-radius:11px; font-size:12px; font-weight:800; color:var(--txt-2); background:rgba(255,255,255,.04); border:1px solid var(--stroke); }
.lb-cats button.active{ color:#04140d; background:linear-gradient(180deg,#28f7a2,#10c87a); border-color:transparent; box-shadow:0 6px 16px rgba(25,233,140,.25); }
.lb-catnote{ font-size:11px; color:var(--txt-3); margin:0 4px 10px; line-height:1.4; }
.lb-catflag{ font-size:11px; color:#ffcf7a; background:rgba(255,177,60,.08); border:1px solid rgba(255,177,60,.2); border-radius:10px; padding:8px 11px; margin:0 2px 12px; }


/* ---- V10 SEXY WIN/LOSS RECAP ---- */
.recap{ animation:recapPop .42s cubic-bezier(.2,.9,.25,1.2); border-radius:16px; }
.recap.win{ box-shadow:inset 0 0 0 1px rgba(25,233,140,.22), 0 0 42px rgba(25,233,140,.12); }
.recap.win.big{ box-shadow:inset 0 0 0 1px rgba(25,233,140,.42), 0 0 66px rgba(25,233,140,.22); }
.recap.loss{ box-shadow:inset 0 0 0 1px rgba(255,77,94,.26), 0 0 42px rgba(255,77,94,.12); }
.recap.reckless{ animation:recapPop .42s cubic-bezier(.2,.9,.25,1.2), recapShake .5s ease .1s 1; }
.rcp-shine{ position:absolute; inset:0; overflow:hidden; pointer-events:none; border-radius:inherit; z-index:2; }
.rcp-shine:before{ content:""; position:absolute; top:-40%; left:-70%; width:55%; height:180%; transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent); animation:recapShine 1.05s ease .28s 1; }
.rcp-tag{ font-size:9.5px; font-weight:900; letter-spacing:2px; text-transform:uppercase; margin:3px 0 1px; }
.recap.win .rcp-tag{ color:#5bf0aa; } .recap.loss .rcp-tag{ color:#ff8a96; }
.recap.reckless .rcp-tag{ animation:dangerPulseText 1.1s ease-in-out infinite; }
.rcp-pnl{ animation:profitPop .55s cubic-bezier(.2,.8,.25,1.3) .08s both; }
.recap.win .rcp-pnl{ text-shadow:0 0 26px rgba(25,233,140,.45); }
.recap.win.big .rcp-pnl{ font-size:40px; }
.recap.loss .rcp-pnl{ text-shadow:0 0 22px rgba(255,77,94,.4); }
.rcp-line{ font-size:13.5px; font-weight:800; margin:-6px 0 12px; line-height:1.3; }
.recap.win .rcp-line{ color:#7df0b6; } .recap.loss .rcp-line{ color:#ff9aa4; }
.recap.loss .rcp-verdict{ animation:dangerPulse 1.4s ease-in-out infinite; }
.rcp-cta{ width:100%; padding:14px; font-size:15px; font-weight:900; letter-spacing:.5px; border-radius:14px; border:none; }
.rcp-cta.win{ background:linear-gradient(180deg,#28f7a2,#10c87a); color:#04140d; box-shadow:0 10px 30px rgba(25,233,140,.35); }
.rcp-cta.loss{ background:linear-gradient(180deg,#3a4750,#222c33); color:#dfe7eb; border:1px solid rgba(255,255,255,.12); }
.rcp-cta:active{ transform:translateY(1px) scale(.99); }
.rcp-tags{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:2px 0 10px; }
.rtag{ font-size:9.5px; font-weight:800; letter-spacing:.3px; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--txt-2); border:1px solid var(--stroke); }
.rtag.skill{ color:var(--green); background:rgba(25,233,140,.1); border-color:rgba(25,233,140,.28); }
.rtag.chaos{ color:#ffcf7a; background:rgba(255,177,60,.1); border-color:rgba(255,177,60,.28); }
.rtag.good{ color:#9ad8ff; background:rgba(90,209,255,.1); border-color:rgba(90,209,255,.26); }
.rtag.warn{ color:#ff8a96; background:rgba(255,77,94,.1); border-color:rgba(255,77,94,.26); }
@keyframes recapPop{ from{opacity:0; transform:translateY(14px) scale(.965);} to{opacity:1; transform:none;} }
@keyframes profitPop{ 0%{opacity:0; transform:scale(.62);} 60%{transform:scale(1.12);} 100%{opacity:1; transform:scale(1);} }
@keyframes recapShine{ from{left:-70%;} to{left:135%;} }
@keyframes recapShake{ 0%,100%{transform:translateX(0);} 18%{transform:translateX(-7px);} 38%{transform:translateX(6px);} 58%{transform:translateX(-4px);} 78%{transform:translateX(3px);} }
@keyframes dangerPulse{ 0%,100%{box-shadow:0 0 16px rgba(255,77,94,.34);} 50%{box-shadow:0 0 30px rgba(255,77,94,.62);} }
@keyframes dangerPulseText{ 0%,100%{opacity:.7;} 50%{opacity:1;} }

/* ---- V10 PREMIUM CHALLENGES ---- */
.chero{ padding:0; margin-bottom:14px; position:relative; overflow:hidden; border:1px solid rgba(25,233,140,.28); }
.chero .inner{ padding:16px; position:relative; z-index:1; }
.chero-glow{ position:absolute; inset:-40% -20% auto -20%; height:80%; z-index:0; pointer-events:none;
  background:radial-gradient(60% 100% at 30% 0%,rgba(25,233,140,.22),transparent 60%),radial-gradient(50% 100% at 90% 10%,rgba(124,92,255,.16),transparent 60%);
  animation:cheroGlow 6s ease-in-out infinite alternate; }
.chead{ display:flex; gap:13px; align-items:flex-start; }

var U = {
  clamp:function(v,a,b){return v<a?a:(v>b?b:v);},
  lerp:function(a,b,t){return a+(b-a)*t;},
  rand:function(a,b){return a+Math.random()*(b-a);},
  randInt:function(a,b){return Math.floor(a+Math.random()*(b-a+1));},
  pick:function(arr){return arr[Math.floor(Math.random()*arr.length)];},
  chance:function(p){return Math.random()<p;},
  // box-muller normal
  gauss:function(){
    var u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  },
  uid:function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);},
  fmtMoney:function(v,dp){
    if(dp==null)dp=2;
    var n=Number(v); if(!isFinite(n))n=0;
    var s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
    return (n<0?'-$':'$')+s;
  },
  fmtSigned:function(v,dp){
    if(dp==null)dp=2;
    var n=Number(v); if(!isFinite(n))n=0;
    var s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
    return (n<0?'-$':'+$')+s;
  },
  fmtNum:function(v,dp){
    var n=Number(v); if(!isFinite(n))n=0;
    return n.toLocaleString('en-US',{minimumFractionDigits:dp||0,maximumFractionDigits:dp==null?0:dp});
  },
  fmtPrice:function(v,dp){
    var n=Number(v); if(!isFinite(n))n=0;
    return n.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
  },
  fmtPct:function(v,dp){
    if(dp==null)dp=2;
    var n=Number(v); if(!isFinite(n))n=0;
    return (n>=0?'+':'')+n.toFixed(dp)+'%';
  },
  fmtR:function(v){
    var n=Number(v); if(!isFinite(n))n=0;
    return (n>=0?'+':'')+n.toFixed(2)+'R';
  },
  fmtCompact:function(v){
    var n=Number(v); if(!isFinite(n))n=0; var a=Math.abs(n);
    if(a>=1e9)return (n/1e9).toFixed(1)+'B';
    if(a>=1e6)return (n/1e6).toFixed(1)+'M';
    if(a>=1e3)return (n/1e3).toFixed(1)+'K';
    return String(Math.round(n));
  },
  ago:function(ts){
    var s=Math.floor((Date.now()-ts)/1000);
    if(s<60)return s+'s ago';
    var m=Math.floor(s/60); if(m<60)return m+'m ago';
    var h=Math.floor(m/60); if(h<24)return h+'h ago';
    var d=Math.floor(h/24); return d+'d ago';
  },
  esc:function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});},
  el:function(id){return document.getElementById(id);}
};

  }
  Object.keys(cands).forEach(function(k){
    if(cands[k].length>candleCap) cands[k]=cands[k].slice(-candleCap);
  });
  Object.keys(slim.newsFeed||{}).forEach(function(k){
    if(slim.newsFeed[k].length>8) slim.newsFeed[k]=slim.newsFeed[k].slice(0,8);
  });
  Object.keys(slim.news||{}).forEach(function(k){
    if(slim.news[k].length>5) slim.news[k]=slim.news[k].slice(0,5);
  });
  if(slim.trades.length>140) slim.trades=slim.trades.slice(-140);
  if(slim.runs.length>30) slim.runs=slim.runs.slice(0,30);
  if(slim.saved.length>30) slim.saved=slim.saved.slice(0,30);
  if(slim.posts.length>24) slim.posts=slim.posts.slice(0,24);
  return slim;
}

function maybeSpawnNews(a, ms){
  // probability scaled to asset news sensitivity, low base
  var p=0.012*a.newsSens;
  if(!U.chance(p)) return;
  var pool=NEWS_TEMPLATES.filter(function(n){return n.cls.indexOf(a.cls)>=0;});
  if(!pool.length) pool=NEWS_TEMPLATES;
  var tpl=U.pick(pool);
  // resolve flavor: continuation / fade / nothing / chop
  var roll=Math.random();
  var flavor= roll<0.42?'continue': roll<0.70?'fade': roll<0.84?'chop': 'nothing';
  var impMag = tpl.imp==='high'?1.0:(tpl.imp==='medium'?0.55:0.25);
  var dir = tpl.bias!==0?tpl.bias:(U.chance(0.5)?1:-1);
  var delay = U.chance(0.3)?U.randInt(1,4):0;
  var n={ id:U.uid(), t:tpl.t, imp:tpl.imp, dir:dir, flavor:flavor, mag:impMag,
          ticks:0, life:U.randInt(8,22), delay:delay, ts:Date.now() };
  if(!S.news[a.id]) S.news[a.id]=[];
  S.news[a.id].push(n);
  // feed for the panel
  if(!S.newsFeed[a.id]) S.newsFeed[a.id]=[];
  S.newsFeed[a.id].unshift({ t:tpl.t, imp:tpl.imp, ts:Date.now(), simMin: ms.epoch });
  if(S.newsFeed[a.id].length>8) S.newsFeed[a.id].pop();
}
// returns {drift, volMul, volume, fade} effect from active news this tick
function newsEffect(a){
  var list=S.news[a.id]; if(!list||!list.length) return {drift:0,volMul:1,volBoost:1,fakeoutBoost:0};
  var drift=0, volMul=1, volBoost=1, fkb=0;
  for(var i=list.length-1;i>=0;i--){
    var n=list[i];
    if(n.delay>0){ n.delay--; continue; }
    n.ticks++;
    var prog=n.ticks/n.life; // 0..1
    var sens=a.newsSens;
    var impulse= n.mag*0.0018*sens;
    if(n.flavor==='continue'){
      drift += n.dir*impulse*(1-prog*0.5);
      volMul = Math.max(volMul, 1+n.mag*0.8);
      volBoost = Math.max(volBoost, 1+n.mag*1.4);
    }else if(n.flavor==='fade'){
      // pump then reverse: first third pushes, then fades opposite
      if(prog<0.35){ drift += n.dir*impulse*1.2; }
      else { drift += -n.dir*impulse*0.7; fkb+=0.10; }
      volMul=Math.max(volMul,1+n.mag*0.7);
      volBoost=Math.max(volBoost,1+n.mag*1.2);
    }else if(n.flavor==='chop'){
      drift += U.gauss()*impulse*0.4;
      volMul=Math.max(volMul,1+n.mag*0.9);
      fkb+=0.12;
      volBoost=Math.max(volBoost,1+n.mag);
    } // 'nothing' -> negligible
    if(n.ticks>=n.life) list.splice(i,1);
  }
  return {drift:drift, volMul:volMul, volBoost:volBoost, fakeoutBoost:fkb};
}

/* ---------- 6. MARKET ENGINE (regime-based) ---------- */
/* regimes carry drift bias (in sigma units) and vol multiplier and typical duration */
var REGIMES={
  bull_trend:      {drift: 0.30, vol:0.95, dur:[8,24],  mr:0.34},
