function transitionRegime(a, ms){
  var cur=ms.regime;
  // weighted next-regime selection influenced by current state & asset personality
  var w={};
  REGIME_NAMES.forEach(function(r){ w[r]=1; });
  // baseline: prefer trends/chop/consolidation
  w.bull_trend+= 1.65*a.trend; w.bear_trend+= 1.65*a.trend;
  w.chop+= 5.5*a.mr; w.consolidation+=4.2; w.accumulation+=1.9; w.distribution+=1.9;
  w.low_vol_drift+=2.2; w.grind_trend+=3.4*a.trend+1.6; w.breakout_retest+=1.4;
  w.pullback+= 1.15; w.breakout+=0.85; w.failed_breakout+=1.25;
  w.liquidity_sweep+= a.fakeout*7.2; w.failed_breakout+=a.fakeout*6.5;
  w.panic_dump+= a.rug*22; w.short_squeeze+= a.squeeze*24;   // V9: rugs toned down (was *34)
  w.high_vol_momentum+= a.vol*160;
  // V2 fairness: stretched markets are much more likely to mean-revert instead of mooning forever
  var prem = Math.log((ms.price||a.base)/Math.max((ms.fair||a.base), 1e-9));
  if(prem>0.045){ w.pullback+=6+prem*80; w.distribution+=4+prem*55; w.bear_trend+=3+prem*50; w.panic_dump+=Math.min(10,prem*42); w.bull_trend*=0.45; w.breakout*=0.55; w.short_squeeze*=0.60; }
  if(prem<-0.045){ w.accumulation+=5+Math.abs(prem)*70; w.bull_trend+=3+Math.abs(prem)*50; w.short_squeeze+=Math.min(10,Math.abs(prem)*44); w.bear_trend*=0.45; w.panic_dump*=0.60; }
  // continuity: after a breakout, lean to trend or failed_breakout
  if(cur==='breakout'){ w.bull_trend+=3; w.high_vol_momentum+=2; w.failed_breakout+=7; w.pullback+=6; w.breakout_retest+=8; }
  if(cur==='breakout_retest'){ w.bull_trend+=4; w.grind_trend+=4; w.high_vol_momentum+=2; }
  if(cur==='grind_trend'){ w.grind_trend+=3; w.pullback+=4; w.chop+=3; w.consolidation+=2; }
  if(cur==='bull_trend'){ w.pullback+=7; w.bull_trend+=1; w.distribution+=4; w.chop+=4; w.grind_trend+=3; }
  if(cur==='bear_trend'){ w.short_squeeze+=4; w.bear_trend+=1; w.accumulation+=4; w.chop+=4; w.grind_trend+=3; }
  if(cur==='panic_dump'){ w.short_squeeze+=7; w.accumulation+=6; w.chop+=4; }
  if(cur==='short_squeeze'){ w.distribution+=7; w.pullback+=7; w.chop+=4; }
  if(cur==='accumulation'){ w.breakout+=2.5; w.bull_trend+=2; w.chop+=2; w.breakout_retest+=2; }
  if(cur==='distribution'){ w.bear_trend+=2; w.panic_dump+=1.5; w.chop+=2; }
  if(cur==='liquidity_sweep'){ w.bull_trend+=3; w.bear_trend+=3; w.chop+=5; w.failed_breakout+=3; }
  // V9 boss event biasing — boss markets get themed regime pressure
  if(S.boss && S.boss.asset===a.id && S.boss.left>0 && BOSS_BIAS[S.boss.kind]){
    var bb=BOSS_BIAS[S.boss.kind]; for(var bk in bb){ if(w[bk]!=null) w[bk]+=bb[bk]; }
  }
  // news pushes toward reaction
  var nlist=S.news[a.id];
  if(nlist&&nlist.some(function(n){return n.delay<=0&&n.ticks<n.life;})){ w.news_reaction+=8; w.high_vol_momentum+=3; w.news_fade+=4; }
  // sample
  var keys=REGIME_NAMES, sum=0; keys.forEach(function(k){sum+=w[k];});
  var roll=Math.random()*sum, pick=keys[0];
  for(var i=0;i<keys.length;i++){ roll-=w[keys[i]]; if(roll<=0){pick=keys[i];break;} }
  ms.regime=pick;
  var rg=REGIMES[pick];
  ms.left=U.randInt(rg.dur[0],rg.dur[1]);
  // set direction for directional regimes
  if(pick==='bull_trend'||pick==='breakout'||pick==='short_squeeze'||pick==='accumulation'||pick==='high_vol_momentum'){ ms.trendDir=1; }
  else if(pick==='bear_trend'||pick==='panic_dump'||pick==='distribution'){ ms.trendDir=-1; }
  else if(pick==='pullback'){ ms.trendDir = -(ms.trendDir||1); } // counter prior
  else if(pick==='grind_trend'||pick==='breakout_retest'){ ms.trendDir = ms.trendDir||1; } // continue prevailing
  else if(pick==='news_reaction'||pick==='news_fade'){
    var nd=0; if(nlist) nlist.forEach(function(n){ nd+=n.dir; });
    ms.trendDir = nd>0?1:(nd<0?-1:(U.chance(0.5)?1:-1));
    if(pick==='news_fade') ms.trendDir=-ms.trendDir;
  }
  // liquidity sweep: a fake direction to trap
  if(pick==='liquidity_sweep'){ ms.trendDir = U.chance(0.5)?1:-1; ms.sweepStage=0; }
}

function initMarket(a, seedN){
  var ms={ regime:'consolidation', left:U.randInt(10,18), trendDir:1, mom:0,
           price:a.base, epoch: 9*60, daycount:0, anchor:a.base, fair:a.base, exhaustion:0 };
  S.market[a.id]=ms;
  // seed history so chart is never blank
  S.candles[a.id]=[];
  var n=seedN||SEED_CANDLES;
  for(var i=0;i<n;i++){ stepCandle(a, true); }
  return ms;
}
/* V9: make sure the asset we're actively viewing has rich history for zoom-out */
function ensureDeepHistory(a, target){
  target=target||SEED_CANDLES;
  if(!S.market[a.id]){ initMarket(a, target); return; }
  var arr=S.candles[a.id]; if(!arr){ arr=S.candles[a.id]=[]; }
  var guard=0;
  while(arr.length<target && guard<target+20){ stepCandle(a, true); guard++; }
}

/* generate one base 1-minute candle for asset; seed=true during warmup (no save) */
function stepCandle(a, seed){
  var ms=S.market[a.id]; if(!ms){ ms=initMarket(a); }
  if(ms.left<=0) transitionRegime(a, ms);
  ms.left--;

  var rg=REGIMES[ms.regime];
  var open=ms.price;

  // news
  if(!seed) maybeSpawnNews(a, ms);
  var ne=newsEffect(a);

  // base per-minute sigma with volatility clustering
  ms.volState = (ms.volState==null?1:ms.volState);
  // GARCH-ish: pull toward 1, shock occasionally
  ms.volState = U.clamp(ms.volState*0.92 + 0.08 + (U.chance(0.05)?U.rand(0.3,1.2):0), 0.5, 3.2);
  var sigma = a.vol * rg.vol * ms.volState * ne.volMul;

  // drift: regime drift (sigma units) * direction-ish + momentum + news + mean reversion to anchor
  var dirSign = (ms.regime==='chop'||ms.regime==='consolidation'||ms.regime==='low_vol_drift'||ms.regime==='failed_breakout'||ms.regime==='liquidity_sweep')?1:(ms.trendDir||1);
  var driftSigma = rg.drift * dirSign;
  // momentum carryover
  ms.mom = ms.mom*0.6 + driftSigma*0.4;
  var mr = (a.mr*0.5 + rg.mr*0.5);
  var anchorPull = -(open-ms.anchor)/ms.anchor * mr * 0.12;
  // slowly drift the anchor with trend so it isn't sticky
  ms.anchor = ms.anchor + (open-ms.anchor)*0.02;

  var driftFrac = (driftSigma*0.35 + ms.mom*0.18)*sigma + ne.drift + anchorPull;

  // V2 realism gravity: price can trend, but stretched moves get heavier and can snap back.
  // This prevents simple infinite long-only runs while keeping breakouts playable.
  var fair = ms.fair || a.base;
  if(!isFinite(fair) || fair<=0) fair=a.base;
  ms.fair = fair + (a.base-fair)*0.00035 + (open-fair)*0.0030;
  var premium = Math.log(open/Math.max(ms.fair,1e-9));
  var gravity = (a.gravity==null?1:a.gravity) * (0.0018 + a.mr*0.0025);
  if(Math.abs(premium)>0.04) gravity *= (1 + Math.min(7, Math.abs(premium)*22));
  driftFrac += -premium * gravity;
  if(Math.abs(premium)>0.10 && U.chance(0.05 + Math.min(0.24, Math.abs(premium)))){
    driftFrac += -Math.sign(premium) * sigma * U.rand(0.9,2.6);
    ms.left = Math.min(ms.left, U.randInt(3,8));
    if(premium>0){ ms.regime=U.pick(['pullback','distribution','failed_breakout','liquidity_sweep']); ms.trendDir=-1; }
    else { ms.regime=U.pick(['accumulation','short_squeeze','failed_breakout','liquidity_sweep']); ms.trendDir=1; }
  }

  // random shock
  var shock=0;
  var fakeoutP = a.fakeout + ne.fakeoutBoost + (ms.regime==='failed_breakout'?0.4:0) + (ms.regime==='liquidity_sweep'?0.5:0);
  if(U.chance(0.018 + a.rug*0.07)){ shock = U.gauss()*sigma*U.rand(1.4,3.0); }  // V9: rugs toned down

  // close
  var noise = U.gauss()*sigma;
  var ret = driftFrac + noise + shock;
  // clamp single-candle move
  ret = U.clamp(ret, -0.18, 0.18);
  var close = open*(1+ret);

  // wick behavior: regimes & sweeps create exaggerated wicks / traps
  var range = Math.abs(close-open) + open*sigma*U.rand(0.4,1.6);
  var upWick = open*sigma*U.rand(0.1,1.1);
  var dnWick = open*sigma*U.rand(0.1,1.1);
  // liquidity sweep: spike beyond then reject (fake breakout wick)
  if(ms.regime==='liquidity_sweep'){
    var spike=open*sigma*U.rand(2.5,5);
    if(ms.trendDir>0){ upWick+=spike; close=open*(1+ -Math.abs(ret)*0.3); }
    else { dnWick+=spike; close=open*(1+ Math.abs(ret)*0.3); }
  }
  if(ms.regime==='failed_breakout' && U.chance(0.6)){
    if(ms.trendDir>0){ upWick+=open*sigma*U.rand(1.5,3); close=open*(1-Math.abs(ret)*0.4); }
    else { dnWick+=open*sigma*U.rand(1.5,3); close=open*(1+Math.abs(ret)*0.4); }
  }
  var hi=Math.max(open,close)+upWick;
  var lo=Math.min(open,close)-dnWick;
  if(lo<=0) lo=Math.min(open,close)*0.9;

  // volume: expansion on momentum/news, dry-up on consolidation
  var volBase = a.volume * (1 + Math.abs(ret)/Math.max(sigma,1e-9)*0.5);
  var volRegime = (rg.vol>1.3?1.6:(rg.vol<0.6?0.5:1.0));
  var vol = volBase*volRegime*ne.volBoost*U.rand(0.6,1.5)*1000;
  vol = Math.max(50, vol);

  ms.price=close;
  ms.epoch=(ms.epoch+1);
  if(ms.epoch>=16*60){ ms.epoch=9*60; ms.daycount++; } // wrap session (approx) for stock/forex feel

  var c={ o:open, h:hi, l:lo, c:close, v:vol, t:ms.epoch + ms.daycount*1440, rg:ms.regime, news: (S.news[a.id]&&S.news[a.id].length>0)?1:0 };
  var arr=S.candles[a.id]; if(!arr){arr=S.candles[a.id]=[];}
  arr.push(c);
  if(arr.length>MAX_CANDLES+40) arr.splice(0, arr.length-(MAX_CANDLES+40));
  // V9 boss countdown — only count live (non-seed) candles on the boss asset
  if(!seed && S.boss && S.boss.left>0 && S.boss.asset===a.id){ tickBoss(); }
  return c;
}

/* ---------- 6B. SMOOTH TAPE ENGINE (visual candle interpolation) ----------
   The market still creates real 1-minute candles, but the currently selected
   candle is revealed through a live tug path so price action feels like a
   believable fight instead of jump-cut candles. */
var VIZ = { active:null };
function activeVisual(assetId){ return (VIZ.active && VIZ.active.assetId===assetId) ? VIZ.active : null; }
var TICKS_PER_CANDLE = 84;   // intrabar microticks — real OHLC formation, not a reveal
function beginVisualCandle(a){
  if(!S.market[a.id]) initMarket(a);
  var full=stepCandle(a,false);
  var o=full.o, hiCap=full.h, loCap=full.l, target=full.c;
  var upRoom=hiCap-o, dnRoom=o-loCap;
  var v={
    assetId:a.id, full:full, phase:0,
    target:target, hiCap:hiCap, loCap:loCap,
    px:o, prevPx:o, hi:o, lo:o, vol:0, tickCount:0, mom:0,
    // microstructure plan (which extremes get swept, when, and bursts)
    sweepHiAt: 0.15 + Math.random()*0.7, sweepLoAt: 0.15 + Math.random()*0.7,
    sweptHi:false, sweptLo:false,
    leadUp: (upRoom>=dnRoom),                          // which side leads early
    burstPhase: 0.2 + Math.random()*0.55, bursting:0,
    pausePhase: 0.3 + Math.random()*0.5,
    partial:{o:o,h:o,l:o,c:o,v:0,t:full.t,rg:full.rg,news:full.news,live:1}
  };
  VIZ.active=v; return v;
}
/* one intrabar microtick: small uneven step toward target with sweeps, bursts, stalls */
function microTick(v){
  var o=v.partial.o, target=v.target, hiCap=v.hiCap, loCap=v.loCap;
  var range=Math.max(hiCap-loCap, Math.abs(o)*1e-6), phase=v.phase;
  // base pull toward eventual close (gentle early, firm late)
  var pull=(target - v.px) * (0.015 + phase*0.11);
  // uneven micro noise (price has tiny snaps/stalls)
  var jitter=Math.random(); var noiseMag = range*(0.015 + 0.07*(1-phase*0.6));
  var noise=(Math.random()*2-1)*noiseMag;
  if(jitter<0.18) noise*=0.15;                          // stalls / hesitation
  // micro momentum carry
  v.mom = v.mom*0.82 + (pull+noise)*0.18;
  var step = pull*0.6 + noise + v.mom*0.7;
  // impulse bursts
  if(!v.bursting && Math.abs(phase-v.burstPhase)<0.03 && Math.random()<0.5){ v.bursting=U.randInt(3,7); }
  if(v.bursting>0){ step += Math.sign(target-o||1)*noiseMag*U.rand(1.4,2.6); v.bursting--; }
  // brief pause/compression band
  if(Math.abs(phase-v.pausePhase)<0.04) step*=0.3;
  v.px += step;
  // planned wick sweeps to the candle extremes (so high/low form from real ticks)
  if(!v.sweptHi && phase>=v.sweepHiAt){ v.px=U.lerp(v.px,hiCap,U.rand(0.55,1)); v.sweptHi=true; v.mom*=-0.3; }
  if(!v.sweptLo && phase>=v.sweepLoAt){ v.px=U.lerp(v.px,loCap,U.rand(0.55,1)); v.sweptLo=true; v.mom*=-0.3; }
  // converge cleanly at the very end so the finalized candle matches the engine candle
  if(phase>=0.97){ v.px=U.lerp(v.px,target,(phase-0.97)/0.03); }
  v.px=U.clamp(v.px, loCap, hiCap);
  if(v.px>v.hi) v.hi=v.px;
  if(v.px<v.lo) v.lo=v.px;
  // volume accumulates, spiking with big steps / bursts
  v.vol += (Math.abs(step)/range)*v.full.v*0.05 + v.full.v*(0.6/TICKS_PER_CANDLE);
  v.tickCount++;
}
function syncPartial(v){
  var hi=Math.min(v.hiCap, Math.max(v.hi, v.px)), lo=Math.max(v.loCap, Math.min(v.lo, v.px));
  v.partial={o:v.partial.o, h:hi, l:lo, c:v.px, v:Math.min(v.full.v, v.vol), t:v.full.t, rg:v.full.rg, news:v.full.news, live:v.phase<1?1:0};
}
function finalizeVisualCandle(v){
  if(!v) return;
  v.phase=1; v.px=v.target; v.hi=v.hiCap; v.lo=v.loCap; v.vol=v.full.v; syncPartial(v);
  if(VIZ.active===v) VIZ.active=null;
}
function baseCandlesForView(assetId){
  var base=S.candles[assetId]||[]; var v=activeVisual(assetId);
  if(v&&v.partial&&base.length&&base[base.length-1]===v.full){ var copy=base.slice(); copy[copy.length-1]=v.partial; return copy; }
  return base;
}
function latestCandleForTrading(assetId){ var v=activeVisual(assetId); if(v&&v.partial) return v.partial; var arr=S.candles[assetId]; return arr&&arr.length?arr[arr.length-1]:null; }
function visualCurrentPrice(assetId){ var v=activeVisual(assetId); return v&&v.partial&&isFinite(v.partial.c)?v.partial.c:null; }

/* ---------- CENTRALIZED WORKING-ORDER EXECUTION (decoupled from any Auto toggle) ----------
   SL/TP are live working orders: if p.sl / p.tp is set, they execute the instant price
   touches/crosses them — checked on every microtick, so fast spikes can't skip them. */
function shouldHitStopOrTarget(p, px){
  if(!p) return null;
  var dirLong=p.dir==='long';
  if(p.tp!=null && (dirLong ? px>=p.tp : px<=p.tp)) return {type:'tp', price:p.tp};
  if(p.sl!=null && (dirLong ? px<=p.sl : px>=p.sl)) return {type:'sl', price:p.sl};
  return null;
}
function closeAtOrderPrice(hit){
  // gaps/rugs get tiny fair slippage against you; normal touches fill exactly at the order
  var p=S.position; if(!p) return;
  var px=hit.price, mid=currentPrice(p.asset), dirLong=p.dir==='long';
  var gapped = dirLong ? (hit.type==='sl' ? mid < px*0.999 : mid > px*1.001)
                       : (hit.type==='sl' ? mid > px*1.001 : mid < px*0.999);
  if(gapped){ var slip=px*0.0008; px = (hit.type==='sl') ? (dirLong?px-slip:px+slip) : px; }
  closePosition(hit.type, px);
}
function checkOrderTriggers(px){
  var p=S.position; if(!p || p._closing) return false;
  if(px==null) px=currentPrice(p.asset);
  var dirLong=p.dir==='long';
  // excursion tracking (max favorable / adverse, in $ and R)
  var u=unrealized();
  if(u>p.mfe){ p.mfe=u; p.mfeR=(p.riskInit||p.risk)>0?u/(p.riskInit||p.risk):0; }
  if(u<p.mae){ p.mae=u; p.maeR=(p.riskInit||p.risk)>0?u/(p.riskInit||p.risk):0; }
  // liquidation floor (independent of SL)
  var loss=(px-p.entry)/p.entry*p.notional*(dirLong?1:-1);
  if(loss <= -p.margin*0.98){ var liqPx=p.entry*(1-(dirLong?1:-1)*(1/p.leverage)*0.98); p._closing=1; closePosition('liq', liqPx); return true; }
  // working SL/TP
  var hit=shouldHitStopOrTarget(p, px);
  if(hit){ p._closing=1; closeAtOrderPrice(hit); return true; }
  return false;
}
// discrete-step entrypoint (single-step / background): honor intrabar extremes, stop-first
function checkSLTP(){
  var p=S.position; if(!p || p._closing) return;
  var last=latestCandleForTrading(p.asset);
  if(last){
    var dirLong=p.dir==='long';
    var slExtreme=dirLong?last.l:last.h, tpExtreme=dirLong?last.h:last.l;
    var slHit=shouldHitStopOrTarget(p, slExtreme);
    if(slHit && slHit.type==='sl'){ p._closing=1; closeAtOrderPrice(slHit); return; }
    var tpHit=shouldHitStopOrTarget(p, tpExtreme);
    if(tpHit && tpHit.type==='tp'){ p._closing=1; closeAtOrderPrice(tpHit); return; }
  }
  checkOrderTriggers(currentPrice(p.asset));
}

/* V12.1: for instantly-created candles (manual shocks, paused Step, volatile events) build a
   realistic ordered intrabar path and trigger SL/TP by touch ORDER — not high/low guessing.
   Heuristic: candles often poke the opposite side first (stop hunt) before the real move,
   then extend to the move-side extreme, then settle to the close. */
function orderedCandlePath(c){
  if(!c) return [];
  var o=c.o, h=c.h, l=c.l, cl=c.c, up=(cl>=o);
  var path = up ? [o,l,h,cl] : [o,h,l,cl];
  var out=[]; for(var i=0;i<path.length;i++){ if(i===0||path[i]!==path[i-1]) out.push(path[i]); }
  return out;
}
function runOrderPathForCandle(c){
  if(!S.position || S.position._closing) return false;
  var path=orderedCandlePath(c);
  for(var i=0;i<path.length;i++){ if(checkOrderTriggers(path[i])) return true; }
  return false;
}
function clearActiveVisualCandleSafely(){
  var v=VIZ.active;
  if(v){ try{ finalizeVisualCandle(v); }catch(e){} }
  VIZ.active=null;
}

function advanceSelectedVisual(dt){
  var a=asset(S.selectedAsset), perCandle=getCandleDurationMs();
  var remain=dt, made=0, guard=0;
  while(remain>0 && guard<14){
    guard++;
    var v=activeVisual(a.id) || beginVisualCandle(a);
    var left=(1-v.phase)*perCandle, use=Math.min(remain,left);
    // advance this slice as discrete microticks, checking working orders on each
    var dPhase=use/perCandle;
    var nTicks=Math.max(1, Math.round(dPhase*TICKS_PER_CANDLE));
    for(var i=0;i<nTicks && v.phase<1; i++){
      v.prevPx=v.px;
      v.phase=Math.min(1, v.phase + 1/TICKS_PER_CANDLE);
      microTick(v);
      if(checkOrderTriggers(v.px)){ return made; }   // order filled mid-candle
    }
    syncPartial(v);
    remain-=use;
    if(v.phase>=0.9999){ finalizeVisualCandle(v); checkOrderTriggers(currentPrice(a.id)); made++; }
    else { break; }
  }
  return made;
}

/* ---------- 7. CANDLE AGGREGATION (1m base -> timeframe) ---------- */
function aggregate(assetId, tfId){
  var base=baseCandlesForView(assetId);
  var n=tfMin(tfId);
  if(n<=1) return base;
  var out=[];
  // align buckets to candle timestamp (minutes)
  var bucket=null, bts=null;
  for(var i=0;i<base.length;i++){
    var c=base[i];
    var b=Math.floor(c.t/n);
    if(bts===null||b!==bts){
      if(bucket) out.push(bucket);
      bts=b;
      bucket={o:c.o,h:c.h,l:c.l,c:c.c,v:c.v,t:c.t,rg:c.rg,news:c.news};
    }else{
      bucket.h=Math.max(bucket.h,c.h);
      bucket.l=Math.min(bucket.l,c.l);
      bucket.c=c.c; bucket.v+=c.v; bucket.rg=c.rg; bucket.news=bucket.news||c.news;
    }
  }
  if(bucket) out.push(bucket);
  return out;
}

function currentPrice(assetId){
  var vp=visualCurrentPrice(assetId);
  if(vp!=null) return vp;
  var ms=S.market[assetId];
  if(ms&&isFinite(ms.price)) return ms.price;
  var arr=S.candles[assetId];
  return arr&&arr.length?arr[arr.length-1].c:asset(assetId).base;
}
// 24h-ish change: compare last close vs ~ a session ago
function dayChangePct(assetId){
  var arr=baseCandlesForView(assetId); if(!arr||arr.length<2) return 0;
  var last=arr[arr.length-1].c;
  var idx=Math.max(0, arr.length-1-390);
  var ref=arr[idx].c;
  return (last-ref)/ref*100;
}

/* ---------- 8. TRADE ENGINE ---------- */
function notionalFor(){
  // notional = sizePct * balance * leverage  (bounded so margin<=balance)
  var bal=S.account.balance;
  var notional = S.sizePct * bal * S.leverage;
  var maxNotional = bal*S.leverage; // 100% size = full leverage
  return U.clamp(notional, 0, maxNotional);
}
function marginFor(notional){ return notional/Math.max(1,S.leverage); }
function riskAmountFor(){
  // risk = notional * stop distance fraction
  return notionalFor()*S.planSLpct;
}

function fillPrice(a, mid, dir, isOpen){
  // apply half-spread + slippage. buy pays ask, sell hits bid.
  var spread=a.spread*mid;
  var slip = a.slip*mid*U.rand(0.4,1.6);
  // worse slippage in fast regimes
  var ms=S.market[a.id];
  if(ms){ var rg=REGIMES[ms.regime]; if(rg&&rg.vol>1.4) slip*=U.rand(1.3,2.2); }
  var px;
  if(dir==='long'){ px = mid + spread/2 + (isOpen?slip:-slip); }
  else { px = mid - spread/2 - (isOpen?slip:-slip); }
  return Math.max(px, mid*0.5);
}

function openPosition(dir){
  if(S.position){ toast('Close current position first','bad'); return; }
  var a=asset(S.selectedAsset);
  var bal=S.account.balance;
  if(bal<=0.5){ openBlownSheet(); return; }
  var notional=notionalFor();
  if(notional<=0.0001){ toast('Increase position size','bad'); return; }
  var margin=marginFor(notional);
  if(margin>bal+0.001){ toast('Not enough balance for this size','bad'); return; }

  var mid=currentPrice(a.id);
  var entry=fillPrice(a, mid, dir, true);
  var qty=notional/entry;

  // SL/TP plan
  var sl=null, tp=null;
  var slDist=S.planSLpct*entry;
  if(S.slOn){ sl = dir==='long' ? entry-slDist : entry+slDist; }
  if(S.tpOn){
    var tpDist=slDist*S.rrTarget;
    tp = dir==='long' ? entry+tpDist : entry-tpDist;
  }
  // revenge-trade detection
  detectRevenge();

  var risk = sl!=null ? Math.abs(entry-sl)*qty : notional*S.planSLpct;
  S.position={
    id:U.uid(), asset:a.id, dir:dir, entry:entry, mid:mid, qty:qty, notional:notional, margin:margin,
    sl:sl, tp:tp, slInit:sl, tpInit:tp, slWidened:false, leverage:S.leverage,
    openTime:Date.now(), openEpoch:(S.market[a.id]?S.market[a.id].epoch:0), openIndex:(S.candles[a.id]||[]).length-1,
    risk:risk, riskInit:risk, spreadPaidEntry:Math.abs(entry-mid)*qty,
    mfe:0, mae:0, mfeR:0, maeR:0   // V9 excursion tracking (max favorable / adverse)
  };
  if(sl!=null) S.stats.slUsedCount++;
  unlock('first_trade');
  if(dir==='long') unlock('long_runner_seed'); else unlock('short_seller');
  flash(dir==='long'?'green':'red');
  fx('open');
  toast((dir==='long'?'Long':'Short')+' '+a.name+' @ '+U.fmtPrice(entry,a.dp));
  recordTradeOpenForDiscipline();
  saveSoon(); renderHome();
}

function unrealized(){
  var p=S.position; if(!p) return 0;
  var mid=currentPrice(p.asset);
  var dirMul=p.dir==='long'?1:-1;
  return (mid-p.entry)/p.entry * p.notional * dirMul;
}
function equity(){ return S.account.balance + unrealized(); }

function closePosition(reason, atPrice){
  var p=S.position; if(!p) return;
  var a=asset(p.asset);
  var mid = atPrice!=null?atPrice:currentPrice(p.asset);
  var exit = atPrice!=null?atPrice:fillPrice(a, mid, p.dir, false);
  var dirMul=p.dir==='long'?1:-1;
  var pnl=(exit-p.entry)/p.entry * p.notional * dirMul;
  // never lose more than margin (liquidation floor handled by liq check)
  var rMult = (p.riskInit||p.risk)>0 ? pnl/(p.riskInit||p.risk) : 0;

  S.account.balance += pnl;
  if(S.account.balance<0) S.account.balance=0;

  var dur=Date.now()-p.openTime;
  var barsHeld=Math.max(1, (S.candles[p.asset]||[]).length-1-(p.openIndex||0));
  var trade={
    id:p.id, asset:p.asset, dir:p.dir, entry:p.entry, exit:exit, qty:p.qty, notional:p.notional,
    sl:p.sl, tp:p.tp, slInit:p.slInit, tpInit:p.tpInit, leverage:p.leverage, pnl:pnl, r:rMult, win:pnl>=0, reason:reason,
    openTime:p.openTime, closeTime:Date.now(), dur:dur, hadSL:p.slInit!=null, slWidened:p.slWidened,
    mfe:p.mfe||0, mae:p.mae||0, mfeR:p.mfeR||0, maeR:p.maeR||0, barsHeld:barsHeld,
    balAfter:S.account.balance
  };
  // V12.1 journal tags (data + funny lesson context)
  trade.category = S.usedManualShock ? 'Chaos' : 'Pure Skill';
  trade.usedShock = !!S.usedManualShock;
  trade.overleveraged = (p.leverage>=25) || ((p.notional/Math.max(1,S.account.starting))>10);
  var _prevTrade = S.trades.length ? S.trades[S.trades.length-1] : null;
  trade.revenge = !!(_prevTrade && !_prevTrade.win && (p.openTime-_prevTrade.closeTime)<4000 && p.leverage>=10);
  S.trades.push(trade);
  if(S.trades.length>320) S.trades=S.trades.slice(-320);

  applyTradeToStats(trade);
  applyTradeToDiscipline(trade);
  checkAchievementsAfterTrade(trade);
  var xpRes=awardXpForTrade(trade);
  trade.xp=xpRes.gained;
  pushRun(trade);
  updateChallengeProgress();
  var dailyXp=updateDailyOnTrade(trade);        // V9 daily objectives
  if(dailyXp>0){ var d2=grantXp(dailyXp); if(d2.leveledTo&&!xpRes.leveledTo) xpRes.leveledTo=d2.leveledTo; trade.xp+=dailyXp; }
  resolveBossOnClose(trade);                     // V9 boss resolution if applicable

  S.position=null;
  flash(pnl>=0?'green':'red');
  if(pnl>=0 && reason==='tp') celebrate();
  fx(reason==='liq'?'liq':reason==='tp'?'tp':reason==='sl'?'sl':(pnl>=0?'win':'loss'));
  var rsn = reason==='tp'?'Take profit hit':reason==='sl'?'Stop loss hit':reason==='liq'?'Liquidated':'Closed';
  toast(rsn+' '+U.fmtSigned(pnl)+' ('+U.fmtR(rMult)+')', pnl>=0?'':'bad');
  if(xpRes.leveledTo) levelUpFx(xpRes.leveledTo);

  // blown account?
  if(S.account.balance<=0.5){ setTimeout(openBlownSheet, 600); }
  saveSoon(); renderHome();
  showTradeRecap(trade, xpRes);                  // V9 premium recap card
}

function autoPlan(){
  // Auto 1:2 RR. If in position, set SL/TP around entry; else set plan defaults.
  S.tpOn=true; S.slOn=true;
  if(S.position){
    var p=S.position; var slDist=p.entry*S.planSLpct;
    p.sl = p.dir==='long'? p.entry-slDist : p.entry+slDist;
    p.tp = p.dir==='long'? p.entry+slDist*S.rrTarget : p.entry-slDist*S.rrTarget;
    p.slInit=p.sl; p.tpInit=p.tp; p.slWidened=false;
    p.risk=Math.abs(p.entry-p.sl)*p.qty;
    toast('Auto plan set — stop & target placed');
  }else{
    toast('Auto plan armed — applies on next entry');
  }
  saveSoon(); renderHome();
}

// adjust SL/TP after entry (stepper). delta is fraction of price.
function nudgeStop(deltaPct){
  var p=S.position; if(!p){ // adjust the pre-trade plan distance
    S.planSLpct=U.clamp(S.planSLpct+deltaPct,0.002,0.10); renderHome(); saveSoon(); return; }
  var a=asset(p.asset);
  if(p.sl==null) p.sl = p.dir==='long'? p.entry*(1-S.planSLpct): p.entry*(1+S.planSLpct);
  var prev=p.sl;
  p.sl = p.sl*(1+ (p.dir==='long'? deltaPct : -deltaPct));
  // detect widening (moving stop further from entry = more risk)
  var prevDist=Math.abs(prev-p.entry), newDist=Math.abs(p.sl-p.entry);
  if(newDist>prevDist+1e-9){ p.slWidened=true; }
  p.risk=Math.abs(p.entry-p.sl)*p.qty;
  S.slOn=true;
  renderHome(); saveSoon();
}
function nudgeTP(deltaPct){
  var p=S.position; if(!p) return;
  if(p.tp==null) p.tp = p.dir==='long'? p.entry*(1+S.planSLpct*Math.max(1,S.rrTarget)): p.entry*(1-S.planSLpct*Math.max(1,S.rrTarget));
  p.tp = p.tp*(1+ (p.dir==='long'? deltaPct : -deltaPct));
  S.tpOn=true; renderHome(); saveSoon();
}
function nudgeRR(delta){
  S.rrTarget=U.clamp((S.rrTarget||2)+delta,0.5,8);
  var p=S.position;
  if(p && p.sl!=null){
    var riskDist=Math.abs(p.entry-p.sl);
    p.tp = p.dir==='long' ? p.entry + riskDist*S.rrTarget : p.entry - riskDist*S.rrTarget;
    S.tpOn=true;
  }
  renderHome(); saveSoon();
}
function toggleStop(){
  var p=S.position;
  if(p){ if(p.sl==null){ p.sl=p.dir==='long'?p.entry*(1-S.planSLpct):p.entry*(1+S.planSLpct); p.slInit=p.sl; S.stats.slUsedCount++; p.risk=Math.abs(p.entry-p.sl)*p.qty; } else { p.sl=null; } S.slOn=p.sl!=null; }
  else { S.slOn=!S.slOn; }
  renderHome(); saveSoon();
}
function toggleTP(){
  var p=S.position;
  if(p){ if(p.tp==null){ p.tp=p.dir==='long'?p.entry*(1+S.planSLpct*S.rrTarget):p.entry*(1-S.planSLpct*S.rrTarget); } else { p.tp=null; } S.tpOn=p.tp!=null; }
  else { S.tpOn=!S.tpOn; }
  renderHome(); saveSoon();
}

/* ---------- 9. STATS ENGINE ---------- */
function applyTradeToStats(t){
  var st=S.stats;
  st.trades++;
  st.sumR+=t.r;
  if(t.win){ st.wins++; st.grossProfit+=t.pnl; st.curStreak=st.curStreak>0?st.curStreak+1:1; if(t.pnl>st.biggestWin)st.biggestWin=t.pnl; }
  else { st.losses++; st.grossLoss+=Math.abs(t.pnl); st.curStreak=st.curStreak<0?st.curStreak-1:-1; if(Math.abs(t.pnl)>st.biggestLoss)st.biggestLoss=Math.abs(t.pnl); }
  if(st.curStreak>st.bestStreak) st.bestStreak=st.curStreak;
  if(t.r>st.bestR) st.bestR=t.r;
  if(t.r>st.bestRunR) st.bestRunR=t.r;
  // long/short
  if(t.dir==='long') st.longCount++; else st.shortCount++;
  // per-asset
  if(!st.assetPnL[t.asset]) st.assetPnL[t.asset]={pnl:0,r:0,trades:0};
  st.assetPnL[t.asset].pnl+=t.pnl; st.assetPnL[t.asset].r+=t.r; st.assetPnL[t.asset].trades++;
  // balances / drawdown
  if(S.account.balance>S.account.peak) S.account.peak=S.account.balance;

  var dd = S.account.peak>0 ? (S.account.peak-S.account.balance)/S.account.peak : 0;
  if(dd>st.maxDD) st.maxDD=dd;

  if(t.hadSL && !t.slWidened){ st.cleanTradeStreak++; if(t.reason==='sl') st.slRespectedCount++; }

  st.weekPnL+=t.pnl;
}

var _lastOpenTs=0, _recentOpens=[];
function recordTradeOpenForDiscipline(){

}
function detectRevenge(){
  // revenge: opening immediately after a loss during a losing streak
  var st=S.stats;
  var last=S.trades[S.trades.length-1];
  if(last && !last.win && st.curStreak<=-2){
    var sinceClose=Date.now()-last.closeTime;
    if(sinceClose<6000){ addViolation('Revenge trade after losses', 7); }
    else { S.discipline.warnings++; }
  }
}
function addViolation(reason, penalty){
  S.discipline.violations++;
  S.discipline.lastViolation=reason;
  S.discipline.cleanStreak=0;
  S.discipline.score=U.clamp(S.discipline.score-(penalty||5),0,100);
  toast('Rule flag: '+reason,'bad');
}
function applyTradeToDiscipline(t){
  var d=S.discipline;
  // overtrading: >6 opens in last minute
  if(_recentOpens.length>6){ addViolation('Overtrading', 5); }
  // oversized risk: risking > 6% of balance on a single trade
  var riskPct = t.notional*S.planSLpct/Math.max(1,t.balAfter-t.pnl);
  if(t.leverage>=10 && S.sizePct>=1 && riskPct>0.08){ d.warnings++; }
  // moved stop wider
  if(t.slWidened){ addViolation('Moved stop wider', 6); }
  // no stop used -> warning + small penalty
  if(!t.hadSL){ d.warnings++; d.score=U.clamp(d.score-2,0,100); }
  // reward clean behavior
  if(t.hadSL && !t.slWidened){ d.cleanStreak++; d.score=U.clamp(d.score+ (t.win?1.4:0.8),0,100); }
  // drawdown breach (challenge limit 8% here scaled)
  var dd = S.account.peak>0?(S.account.peak-S.account.balance)/S.account.peak:0;
  if(dd>0.20){ if(!d._ddFlag){ addViolation('Max drawdown breached', 8); d._ddFlag=true; } }
  else { d._ddFlag=false; }
}
function ruleStatus(){
  var d=S.discipline;
  if(S.account.balance<=0.5) return {label:'FAILED CHALLENGE', cls:'neg'};
  if(d.violations>=3) return {label:'VIOLATION', cls:'neg'};
  if(d.violations>=1 || d.warnings>=4) return {label:'WARNING', cls:'amber'};
  return {label:'ALL RULES MET', cls:'pos'};
}
function rulePct(){
  // % of trades that respected the rules (had SL, not widened)
  var t=S.trades; if(!t.length) return 100;
  var ok=t.filter(function(x){return x.hadSL && !x.slWidened;}).length;
  return Math.round(ok/t.length*100);
}

var loop = { raf:null, last:0, acc:0, bgAcc:0, renderAcc:0 };

var chartGesture={mode:null,startX:0,startY:0,startPan:0,startZoom:1,startDist:0,target:null,lastX:0,lastT:0,vel:0,moved:0};
var _dragGlow=null;
function touchDist(t0,t1){ var dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY; return Math.sqrt(dx*dx+dy*dy); }
function chartPlotMetrics(){ var d=chartDims(); return { plotW:d.w-78-8, allLen:(getCandlesView()||[]).length }; }
function chartLocalY(host, clientY){ var r=host.getBoundingClientRect(); return clientY-r.top; }
function chartPriceFromLocalY(y){ var m=S.chartMeta; if(!m) return null; var yy=U.clamp(y,m.padT,m.padT+m.plotH); return m.hi - ((yy-m.padT)/m.plotH)*m.range; }
function detectChartEditTarget(host, clientX, clientY){
  var p=S.position, m=S.chartMeta; if(!p || !m || p.asset!==S.selectedAsset) return null;
  var r=host.getBoundingClientRect(), lx=clientX-r.left, ly=clientY-r.top;
  var hitX = lx > (m.d.w - 88);   // generous right-gutter zone (grip + pill)
  var best=null, bestD=1e9;
  [['sl',m.slY],['tp',m.tpY]].forEach(function(it){
    if(it[1]==null) return; var dist=Math.abs(ly-it[1]); if(dist<bestD){ bestD=dist; best=it[0]; }
  });
  if(best && (bestD<24 || (hitX && bestD<46))) return best;

}
function applyDraggedLine(target, price){
  var p=S.position; if(!p || p.asset!==S.selectedAsset) return;
  var minGap=p.entry*0.0015;
  if(target==='sl'){
    if(p.dir==='long') p.sl=Math.min(price, p.entry-minGap); else p.sl=Math.max(price, p.entry+minGap);
    p.risk=Math.abs(p.entry-p.sl)*p.qty; S.slOn=true;
  } else if(target==='tp'){
    if(p.dir==='long') p.tp=Math.max(price, p.entry+minGap); else p.tp=Math.min(price, p.entry-minGap);
    S.tpOn=true;
  }
}
function beginPan(host, clientX, clientY){
  stopInertia();
  chartGesture.mode='pan'; chartGesture.startX=clientX; chartGesture.startY=clientY;
  chartGesture.startPan=S.chartPan||0; chartGesture.lastX=clientX; chartGesture.lastT=performance.now();
  chartGesture.vel=0; chartGesture.moved=0; if(host) host.style.cursor='grabbing';
}
/* pan delta -> content follows finger (drag right reveals older candles, TradingView feel) */
function panFromDX(dx){
  var m=chartPlotMetrics(), vis=visibleBarsForWidth(m.plotW, m.allLen);
  return { pan:U.clamp(chartGesture.startPan + dx*(vis/Math.max(m.plotW,1)), 0, maxChartPan(vis, m.allLen)), vis:vis, m:m };
}
var chartInertia={raf:null};
function stopInertia(){ if(chartInertia.raf){ cancelAnimationFrame(chartInertia.raf); chartInertia.raf=null; } }
function startInertia(){
  stopInertia();
  var v=U.clamp(chartGesture.vel, -0.6, 0.6); // pan-units per ms
  if(Math.abs(v)<0.004) { saveSoon(); return; }
  var last=performance.now();
  function step(now){
    var dt=Math.min(40, now-last); last=now;
    var m=chartPlotMetrics(), vis=visibleBarsForWidth(m.plotW, m.allLen), lim=maxChartPan(vis, m.allLen);
    var np=U.clamp((S.chartPan||0)+v*dt, 0, lim);
    S.chartPan=np; v*=Math.pow(0.945, dt/16);
    renderChart();
    if(Math.abs(v)>0.012 && np>0 && np<lim){ chartInertia.raf=requestAnimationFrame(step); }
    else { chartInertia.raf=null; saveSoon(); }
  }
  chartInertia.raf=requestAnimationFrame(step);
}
function chartGrab(target){ _dragGlow=target; chartGesture.mode='edit'; chartGesture.target=target; chartUpdateDragTip(target); }
function chartRelease(){
  _dragGlow=null; chartGesture.mode=null; chartGesture.target=null; chartHideDragTip();
  var host=U.el('chart-host'); if(host) host.style.cursor='grab';
}
/* live SL/TP drag tooltip (price + risk% + R) */
function chartUpdateDragTip(target){
  var tip=U.el('chart-drag-tip'); if(!tip) return;
  var p=S.position, a=asset(S.selectedAsset), m=S.chartMeta;
  if(!p||!m||p.asset!==S.selectedAsset){ tip.classList.remove('show'); return; }
  var price = target==='sl'?p.sl:p.tp, y = target==='sl'?m.slY:m.tpY;
  if(price==null||y==null){ tip.classList.remove('show'); return; }
  var risk=(p.sl!=null)?Math.abs(p.entry-p.sl)*p.qty:0;
  var riskPct=S.account.balance>0?risk/S.account.balance*100:0;
  var rr=(p.sl!=null&&p.tp!=null)?Math.abs(p.tp-p.entry)/Math.max(1e-9,Math.abs(p.entry-p.sl)):0;
  var col = target==='sl'?'#ff8a96':'#66f2ba';
  tip.style.top = U.clamp(y, 20, (m.d?m.d.h:300)-20)+'px';
  tip.style.borderColor=col;
  tip.innerHTML='<b style="color:'+col+'">'+(target==='sl'?'STOP ':'TARGET ')+U.fmtPrice(price,a.dp)+'</b>'+
    '<i>risk '+(p.sl!=null?('−'+riskPct.toFixed(1)+'%'):'—')+'  ·  '+(rr>0?rr.toFixed(2)+'R':'—')+'</i>';

function chartHideDragTip(){ var tip=U.el('chart-drag-tip'); if(tip) tip.classList.remove('show'); }

var chartPointers={};
function pointerCount(){ return Object.keys(chartPointers).length; }
function chartEditTargetFromEvent(host, e){
  var dl = (e.target && e.target.getAttribute) ? e.target.getAttribute('data-drag-line') : null;
  if(dl==='sl'||dl==='tp') return dl;
  return detectChartEditTarget(host, e.clientX, e.clientY); // proximity fallback
}
function bindChartInteractions(host){
  if(!host || host._boundChartUX) return;
  host._boundChartUX=1;
  host.addEventListener('wheel', function(e){
    e.preventDefault(); stopInertia();
    var factor=e.deltaY<0?1.16:0.86;
    S.chartZoom=clampChartZoom((S.chartZoom||1) * factor);
    renderChart(); saveSoon();
  }, {passive:false});
  host.addEventListener('pointerdown', function(e){
    stopInertia();
    chartPointers[e.pointerId]={x:e.clientX,y:e.clientY};
    if(pointerCount()===2){
      var ks=Object.keys(chartPointers), p0=chartPointers[ks[0]], p1=chartPointers[ks[1]];
      chartGesture.mode='pinch';
      chartGesture.startDist=Math.hypot(p0.x-p1.x,p0.y-p1.y)||1;
      chartGesture.startZoom=S.chartZoom||1;
      chartHideDragTip();
      e.preventDefault(); return;
    }
    if(pointerCount()>2) return;
    var target=chartEditTargetFromEvent(host, e);
    if(target){ chartGrab(target); chartGesture.startY=e.clientY; host.style.cursor='ns-resize'; e.preventDefault(); renderChart(); }
    else { beginPan(host, e.clientX, e.clientY); e.preventDefault(); }
  });
}
/* GLOBAL pointer listeners — attached ONCE so re-rendering the chart host never stacks duplicates */
function bindChartGlobals(){
  if(window._chartGlobalBound) return; window._chartGlobalBound=1;
  window.addEventListener('pointermove', function(e){
    if(!(e.pointerId in chartPointers) && chartGesture.mode!=='pan' && chartGesture.mode!=='edit') return;
    if(e.pointerId in chartPointers) chartPointers[e.pointerId]={x:e.clientX,y:e.clientY};
    var host=U.el('chart-host'); if(!host) return;
    if(chartGesture.mode==='pinch' && pointerCount()>=2){
      var ks=Object.keys(chartPointers), p0=chartPointers[ks[0]], p1=chartPointers[ks[1]];
      var dist=Math.hypot(p0.x-p1.x,p0.y-p1.y)||1;
      S.chartZoom=clampChartZoom(chartGesture.startZoom*(dist/Math.max(1,chartGesture.startDist)));
      renderChart(); return;
    }
    if(chartGesture.mode==='edit'){
      applyDraggedLine(chartGesture.target, chartPriceFromLocalY(chartLocalY(host, e.clientY)));
      renderChart(); patchRiskLive(); chartUpdateDragTip(chartGesture.target);
    } else if(chartGesture.mode==='pan'){
      var now=performance.now(), r=panFromDX(e.clientX-chartGesture.startX);
      var ddx=e.clientX-chartGesture.lastX, ddt=Math.max(1, now-chartGesture.lastT);
      chartGesture.vel=(ddx*(r.vis/Math.max(r.m.plotW,1)))/ddt;
      chartGesture.moved+=Math.abs(ddx); chartGesture.lastX=e.clientX; chartGesture.lastT=now;
      S.chartPan=r.pan; renderChart();
    }
  });
  function endPointer(e){
    delete chartPointers[e.pointerId];
    var wasMode=chartGesture.mode;
    if(wasMode==='pinch'){
      if(pointerCount()<2){ chartGesture.mode=null; saveSoon();
        // if one finger remains, smoothly hand back to pan
        var ks=Object.keys(chartPointers);
        if(ks.length===1){ var h=U.el('chart-host'); if(h) beginPan(h, chartPointers[ks[0]].x, chartPointers[ks[0]].y); }
      }
      return;
    }
    if(wasMode==='edit'){ chartRelease(); renderHome(); saveSoon(); }
    else if(wasMode==='pan'){ chartGesture.mode=null; startInertia(); }
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
}
function setupChartObserver(){
  var host=U.el('chart-host'); if(!host) return;
  bindChartInteractions(host); bindChartGlobals();
  if(chartRO){ try{chartRO.disconnect();}catch(e){} }
  if(window.ResizeObserver){
    chartRO=new ResizeObserver(function(){ renderChart(); });
    chartRO.observe(host);
  } else {
    window.addEventListener('resize', renderChart);
  }
}

function sparkline(vals, w, h, col, fill){
  if(!vals||vals.length<2) return '<svg width="'+w+'" height="'+h+'"></svg>';
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rng=mx-mn||1;
  var pts=vals.map(function(v,i){ var x=i/(vals.length-1)*w; var y=h-((v-mn)/rng)*(h-3)-1.5; return x.toFixed(1)+','+y.toFixed(1); });
  var line='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round"/>';
  var area='';
  if(fill){ area='<polygon points="0,'+h+' '+pts.join(' ')+' '+w+','+h+'" fill="'+col+'" opacity=".10"/>'; }
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+area+line+'</svg>';
}
function gaugeArc(frac, col){

  var cx=60, cy=62, r=44;
  function pt(ang){ return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)]; }
  var p0=pt(a0), pe=pt((end*Math.PI/180)), pv=pt(a1);
  var large=(end-start)*frac>180?1:0;
  var track='<path d="M'+p0[0].toFixed(1)+','+p0[1].toFixed(1)+' A'+r+','+r+' 0 1 1 '+pe[0].toFixed(1)+','+pe[1].toFixed(1)+'" stroke="rgba(255,255,255,.07)" stroke-width="7" fill="none" stroke-linecap="round"/>';
  var val='<path d="M'+p0[0].toFixed(1)+','+p0[1].toFixed(1)+' A'+r+','+r+' 0 '+large+' 1 '+pv[0].toFixed(1)+','+pv[1].toFixed(1)+'" stroke="'+col+'" stroke-width="7" fill="none" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 120 78">'+track+val+'</svg>';
}
function bigGauge(score){

function playerRank(){
  var lvl=levelFromXp(S.profile.xp).level;
  var tiers=[
    {min:1,name:'Rookie',col:'#9aa7ad'},{min:4,name:'Bronze I',col:'#e0945a'},{min:7,name:'Bronze III',col:'#e0945a'},
    {min:10,name:'Silver II',col:'#cfe0e6'},{min:14,name:'Gold I',col:'#ffd24a'},{min:18,name:'Gold III',col:'#ffd24a'},
    {min:22,name:'Platinum II',col:'#7fffd4'},{min:27,name:'Diamond I',col:'#2fe6c8'},{min:32,name:'Diamond III',col:'#2fe6c8'},
    {min:40,name:'Master',col:'#19e98c'},{min:50,name:'Grandmaster',col:'#19e98c'}
  ];
  var r=tiers[0];
  for(var i=0;i<tiers.length;i++){ if(lvl>=tiers[i].min) r=tiers[i]; }
  return {name:r.name, col:r.col, level:lvl};
}
function playerTitle(){
  var b=S.stats.bestBalance;
  if(b>=500) return 'Elite Trader';
  if(b>=250) return 'Funded Warrior';
  if(b>=150) return 'Consistency Trader';
  if(b>=125) return 'Rookie Graduate';
  return 'Rookie';
}
function disciplineLabel(s){
  if(s>=85) return 'Excellent'; if(s>=70) return 'Solid'; if(s>=55) return 'Fair'; if(s>=40) return 'Shaky'; return 'At Risk';
}
function balanceSpark(){
  // build from recent trade balAfter
  var pts=S.trades.slice(-16).map(function(t){return t.balAfter;});
  pts.unshift(S.account.starting);
  if(pts.length<2) pts=[S.account.starting,S.account.balance];
  return pts;
}

/* V11: candles must stay unobstructed.
   Normal mode  -> a tiny collapsible P&L pill only (tap to go fullscreen).
   Fullscreen   -> a compact bottom dock: Buy/Sell when flat, position controls when in a trade. */
function renderChartDock(p,a){
  var hasPos = p && p.asset===a.id;
  var s='';
  if(hasPos){
    var u=unrealized(), uR=(p.riskInit||p.risk)>0?u/(p.riskInit||p.risk):0;
    s+='<button class="chart-pnlpill" id="chart-pnlpill" data-act="chart-fullscreen" aria-label="Open fullscreen">'+
        '<span class="pp-dir '+p.dir+'">'+(p.dir==='long'?'▲':'▼')+'</span>'+
        '<span class="cd-pnl '+(u>=0?'pos':'neg')+'" id="cd-pnl">'+U.fmtSigned(u)+'</span>'+
        '<span class="cd-r '+(uR>=0?'pos':'neg')+'" id="cd-r">'+U.fmtR(uR)+'</span>'+
      '</button>';
  }
  s+='<div class="fs-dock">'+renderFsDockInner(p,a)+'</div>';
  return s;
}

function toggleChartFs(){
  var on=!document.body.classList.contains('fs-chart');
  document.body.classList.toggle('fs-chart', on);
  try{ document.documentElement.style.overflow=on?'hidden':''; document.body.style.overflow=on?'hidden':''; }catch(e){}
  stopInertia();
  var fb=document.querySelector('.chart-fsbtn'); if(fb) fb.innerHTML = on?ICON.compress:ICON.expand;
  // redraw at the new size after layout settles (market keeps running; state preserved)
  renderChart(); setTimeout(renderChart,30); setTimeout(renderChart,140);
  saveSoon();
}
function moveSlToEntry(){
  var p=S.position; if(!p){ toast('No position to protect'); return; }
  p.sl=p.entry; p.risk=0; p.slWidened=false; S.slOn=true;  // R stays anchored to riskInit
  if(p.slInit==null) p.slInit=p.entry;
  toast('🛡️ Stop moved to break-even'); flash('green');
  patchRiskLive(); renderHome();
}
/* auto-collapse the on-chart P&L pill to a tiny dot after a few seconds */
var _pnlPillTimer=null;
function schedulePnlPillCollapse(){
  if(_pnlPillTimer) clearTimeout(_pnlPillTimer);
  var e=U.el('chart-pnlpill'); if(e) e.classList.remove('mini');
  _pnlPillTimer=setTimeout(function(){ var el=U.el('chart-pnlpill'); if(el) el.classList.add('mini'); }, 4200);
}

/* ---------- live patch (called every tick) ---------- */
function updateHome(){
  if(U.el('screen-home') && !U.el('screen-home').classList.contains('active')) { return; }
  // if position OR boss presence changed since last full render, rebuild
  if(_homeRenderedWithPos!==!!S.position || _homeRenderedWithBoss!==!!S.boss){ renderHome(); return; }
  var a=asset(S.selectedAsset);
  // balance / pnl / account milestone (advances automatically when a target is crossed)
  var bal=S.account.balance, tpnl=totalPnL();
  var be=U.el('hb-balance'); if(be) be.textContent=U.fmtMoney(bal);
  var pe=U.el('hb-pnl'); if(pe){ pe.textContent=U.fmtSigned(tpnl); pe.className='v '+(tpnl>=0?'pos':'neg'); }
  var ms=accountMilestone(bal);
  var we=U.el('hb-warrior'); if(we) we.style.width=(ms.frac*100).toFixed(1)+'%';
  var mt=U.el('hb-ms-target'); if(mt) mt.textContent=ms.maxed?'MAXED':'Next '+milestoneLabel(ms.target);
  var mti=U.el('hb-ms-title'); if(mti) mti.textContent=ms.title;
  var msub=U.el('hb-ms-sub'); if(msub) msub.textContent=ms.maxed?'Top milestone reached 🐐':(U.fmtMoney(bal)+' / '+milestoneLabel(ms.target)+' · '+ms.pct+'%');
  // ticker prices
  document.querySelectorAll('[data-tkpr]').forEach(function(elp){
    var id=elp.getAttribute('data-tkpr'); var pr=currentPrice(id), chg=dayChangePct(id);
    elp.textContent=U.fmtPrice(pr,asset(id).dp); elp.className='pr '+(chg>=0?'pos':'neg')+' tnum';
  });
  // position banner numbers
  if(S.position){
    var u=unrealized();
    var bn=document.querySelector('.posbanner .pnlv'); if(bn){ bn.textContent=U.fmtSigned(u); bn.className='pnlv '+(u>=0?'pos':'neg'); }
    var cb=document.querySelector('.tradebtns [data-act="close-pos"]'); if(cb) cb.innerHTML='CLOSE · '+U.fmtSigned(u);
    var uR=(S.position.riskInit||S.position.risk)>0?u/(S.position.riskInit||S.position.risk):0;
    // floating chart dock
    var dp=U.el('cd-pnl'); if(dp){ dp.textContent=U.fmtSigned(u); dp.className='cd-pnl '+(u>=0?'pos':'neg'); }
    var dr=U.el('cd-r'); if(dr){ dr.textContent=U.fmtR(uR); dr.className='cd-r '+(uR>=0?'pos':'neg'); }
    var fdp=U.el('fcd-pnl'); if(fdp){ fdp.textContent=U.fmtSigned(u); fdp.className='cd-pnl '+(u>=0?'pos':'neg'); }
    var fdr=U.el('fcd-r'); if(fdr){ fdr.textContent=U.fmtR(uR); fdr.className='cd-r '+(uR>=0?'pos':'neg'); }
    // update mark/R/equity cells
    var cells=document.querySelectorAll('.posgrid .c b');
    if(cells.length>=4){
      cells[1].textContent=U.fmtPrice(currentPrice(a.id),a.dp);
      cells[2].textContent=U.fmtR(uR); cells[2].className=(uR>=0?'pos':'neg');
      cells[3].textContent=U.fmtMoney(equity());
    }
  }
  updateRadar();
  if(S.boss) updateBossBanner();
  // don't fight an active SL/TP drag (renderChart is driven by the gesture itself then)
  if(chartGesture.mode!=='edit') renderChart();
}

  var hex=U.el('run-hex'), lbl=U.el('run-lbl'), sub=U.el('run-sub');
  if(hex){ hex.className='runhex '+(S.running?'running':'paused'); var bg=hex.querySelector('.hexbg'); if(bg) bg.outerHTML=hexSVG(S.running); }
  if(lbl) lbl.textContent=S.running?'PAUSE':'RUN';

function rSeries(){
  var arr=S.trades.slice(-14).map(function(t,i){return t.r;});

  if(out.length<2) out=[0,0];
  return out;

function donut(frac){
  frac=U.clamp(frac,0,1);
  var r=38, c=2*Math.PI*r, cx=48, cy=48;
  var seg=c*frac;
  return '<svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="38" fill="none" stroke="#ff4d5e" stroke-width="11"/>'+
    '<circle cx="48" cy="48" r="38" fill="none" stroke="#19e98c" stroke-width="11" stroke-dasharray="'+seg.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 48 48)" stroke-linecap="round"/>'+
    '<text x="48" y="46" text-anchor="middle" fill="#e9f2ef" font-size="15" font-weight="800">'+Math.round(frac*100)+'%</text>'+
    '<text x="48" y="60" text-anchor="middle" fill="#67737a" font-size="9">LONG</text></svg>';
}

    }

  }).join('');

function switchScreen(name){
  if(SCREENS.indexOf(name)<0) name='home';
  _active=name;
  // never leave fullscreen chart mode stuck behind another screen
  if(document.body.classList.contains('fs-chart')){
    document.body.classList.remove('fs-chart');
    try{ document.documentElement.style.overflow=''; document.body.style.overflow=''; }catch(e){}
  }
  SCREENS.forEach(function(s){
    var el=U.el('screen-'+s); if(el) el.classList.toggle('active', s===name);
  });
  // (re)render target screen for fresh data
  if(name==='home') renderHome();
  else if(name==='challenges') renderChallenges();
  else if(name==='leaderboard') renderLeaderboard();
  else if(name==='social') renderSocial();
  else if(name==='profile') renderProfile();
  renderNav();
  // scroll to top
  var sc=U.el('screen-'+name); if(sc) sc.scrollTop=0;
  // re-render chart after layout settles when returning home
  if(name==='home') setTimeout(renderChart,30);
}

/* ---------- 24. SINGLE DELEGATED CLICK HANDLER ---------- */
document.addEventListener('click', function(ev){
  var node=ev.target.closest('[data-act]');
  if(!node) return;
  var act=node.getAttribute('data-act');
  var ds=node.dataset;
  try{ handleAction(act, ds, node); }
  catch(e){ showError('Action "'+act+'": '+e.message); }
});

function handleAction(act, ds, node){
  switch(act){
    case 'nav': switchScreen(ds.nav); break;
    case 'close-modal': closeModal(); break;

    // asset / chart
    case 'select-asset':
      if(ds.asset && ds.asset!==S.selectedAsset){
        if(S.position){ toast('Close your position before switching markets'); closeModal(); break; }
        S.selectedAsset=ds.asset;
        if(!S.market[ds.asset]) initMarket(asset(ds.asset));
        ensureDeepHistory(asset(ds.asset), SEED_CANDLES);
        S.chartPan=0; S.chartZoom=1; stopInertia();
        saveSoon(); renderHome(); setTimeout(renderChart,20);
      }
      closeModal();
      break;
    case 'set-tf': S.selectedTimeframe=ds.tf; saveSoon(); renderHome(); setTimeout(renderChart,20); break;
    case 'toggle-watch': if(ds.asset){ toggleWatch(ds.asset); renderHome(); } ev_stop(); break;
    case 'more-assets': openAssetPicker(); break;
    case 'asset-info': openAssetPersonality(ds.asset); break;
    case 'asset-filter': openAssetPicker(ds.filter || 'all'); saveSoon(); break;
    case 'chart-reset': S.chartPan=0; S.chartZoom=1; stopInertia(); renderChart(); saveSoon(); break;
    case 'chart-fullscreen': toggleChartFs(); break;
    case 'sl-to-entry': moveSlToEntry(); break;

    // sizing

/* toast + flash */
var _toastT=null;
function toast(msg, kind){
  if(!msg) return;
  var t=U.el('toast'); if(!t) return;
  t.className=''; void t.offsetWidth;
  t.innerHTML=(kind==='bad'?'<span class="ti">⚠</span>':'<span class="ti" style="color:#19e98c">●</span>')+'<span>'+U.esc(msg)+'</span>';
  t.classList.add('show'); if(kind==='bad')t.classList.add('bad');
  if(_toastT)clearTimeout(_toastT);
  _toastT=setTimeout(function(){ t.classList.remove('show'); },2200);
}

  f.className='flash'; void f.offsetWidth; f.classList.add(color);

}

  closeModal();
  toast('Account reset to '+U.fmtMoney(STARTING)+' · run #'+(S.account.resetCount+1));
  save(); renderHome();
  if(viaAd){
    // a rewarded ad just played — set an ad cooldown so another ad doesn't appear right away
    if(!S.adState) S.adState={tradesSinceAd:0,lastAdTs:0};
    S.adState.lastAdTs=Date.now();
  }
  // never stack a second ad immediately after a rewarded reset; free gets the next one later naturally
}

/* ---- V12.1 ASSET PERSONALITY (derived from existing knobs; no hand-written 129 descriptions) ---- */
function assetRiskLabel(t){
  var v=t.vol||0, rug=t.rug||0;
  if(rug>=0.08 || v>=0.004) return 'Menace';
  if(rug>=0.05 || v>=0.0025) return 'Ruggy';
  if(v>=0.0014) return 'Volatile';
  if(v<=0.0006) return 'Smooth';
  return 'Active';
}
function assetPersonality(t){
  var volatility=U.clamp((t.vol||0)/0.005,0,1);
  var trendiness=U.clamp(((t.trend||0.35)-0.28)/0.2,0,1);
  var meanRev=U.clamp(((t.mr||0.4)-0.2)/0.45,0,1);
  var rug=U.clamp((t.rug||0)/0.16,0,1);
  var squeeze=U.clamp((t.squeeze||0)/0.3,0,1);
  var fakeout=U.clamp((t.fakeout||0)/0.4,0,1);
  var news=U.clamp((t.newsSens||1)/3,0,1);
  var style = trendiness>meanRev+0.12 ? 'Trend / breakout' : (meanRev>trendiness+0.12 ? 'Fade / mean-reversion' : 'Scalp · both ways');
  if(volatility>0.8 && rug>0.5) style='Scalp with hard stops';
  var bits=[volatility>0.8?'Unhinged volatility':volatility>0.5?'High volatility':volatility<0.25?'Smooth, institutional tape':'Moderate volatility'];
  if(rug>0.6) bits.push('brutal rug risk'); else if(rug>0.3) bits.push('real rug risk');
  if(squeeze>0.6) bits.push('violent squeezes');
  if(fakeout>0.6) bits.push('nasty fakeouts'); else if(fakeout>0.4) bits.push('frequent fakeouts');
  if(news>0.6) bits.push('headline-sensitive');
  if(trendiness>0.7) bits.push('loves to trend'); else if(meanRev>0.7) bits.push('snaps back to fair value');
  var desc=bits.slice(0,4).join(', '); desc=desc.charAt(0).toUpperCase()+desc.slice(1)+'.';
  if(rug>0.5||volatility>0.85) desc+=' Stops mandatory.';
  return {volatility:volatility,trendiness:trendiness,meanRev:meanRev,rug:rug,squeeze:squeeze,fakeout:fakeout,news:news,style:style,desc:desc,label:assetRiskLabel(t)};
}
function openAssetPersonality(id){
  var t=asset(id), p=assetPersonality(t);
  function bar(k,v){ return '<div class="ap-row"><span class="ap-k">'+k+'</span><span class="ap-bar"><i style="width:'+Math.round(v*100)+'%"></i></span></div>'; }
  openModal(

};
function shockCooldownMs(type){ var d=SHOCK_DEF[type]; return isPro()?d.proCd:d.freeCd; }
function shockReadyIn(type){ var t=(S.cooldowns&&S.cooldowns[type])||0; return Math.max(0, t-Date.now()); }

function doNewsShock(){
  var a=asset(S.selectedAsset);
  var ms=S.market[a.id]; if(!ms) ms=initMarket(a);
  clearActiveVisualCandleSafely();              // no stale forming candle fighting the shock
  // force a strong news + regime jolt
  var pool=NEWS_TEMPLATES.filter(function(n){return n.cls.indexOf(a.cls)>=0;});
  if(!pool.length) pool=NEWS_TEMPLATES;
  var tpl=U.pick(pool);
  var dir=tpl.bias!==0?tpl.bias:(U.chance(0.5)?1:-1);
  var flavor=U.pick(['continue','fade','chop']);
  if(!S.news[a.id]) S.news[a.id]=[];
  S.news[a.id].push({ id:U.uid(), t:tpl.t, imp:'high', dir:dir, flavor:flavor, mag:1.0, ticks:0, life:U.randInt(10,20), delay:0, ts:Date.now() });
  if(!S.newsFeed[a.id]) S.newsFeed[a.id]=[];
  S.newsFeed[a.id].unshift({ t:tpl.t, imp:'high', ts:Date.now(), simMin:ms.epoch });
  if(S.newsFeed[a.id].length>8) S.newsFeed[a.id].pop();
  // jolt regime — the live tape then carries the move over the next candles
  ms.regime = U.pick(['news_reaction','high_vol_momentum','liquidity_sweep', dir>0?'short_squeeze':'panic_dump']);
  ms.left=U.randInt(5,10); ms.trendDir=dir; ms.volState=Math.max(ms.volState||1,2.2);
  // one immediate impulse candle, checked through an ordered path (fast spikes can't skip SL/TP)
  stepCandle(a,false); runOrderPathForCandle(latestCandleForTrading(a.id));
  flash(dir>0?'green':'red'); fx('shock'); toast('⚡ '+tpl.t.split(' ').slice(0,5).join(' ')+'…');
  renderHome();
}

var EARNINGS_EVENTS=[
  {t:'Earnings beat — but guidance weak',         dir:1,  fade:true },
  {t:'Earnings miss — short squeeze rips',        dir:1,  squeeze:true },
  {t:'AI revenue surprise stuns the street',      dir:1,  cont:true },
  {t:'CEO warning spooks traders',                dir:-1, cont:true },
  {t:'Margin expansion blows past estimates',     dir:1,  cont:true },

  {t:'Gap down, dip buyers fight back',           dir:-1, squeeze:true },
  {t:'Blowout quarter — gap and go',              dir:1,  cont:true }
];
function doEarningsShock(){
  var a=asset(S.selectedAsset);
  var ms=S.market[a.id]; if(!ms) ms=initMarket(a);
  clearActiveVisualCandleSafely();
  var ev=U.pick(EARNINGS_EVENTS);
  var dir = ev.dir!==0 ? ev.dir : (U.chance(0.5)?1:-1);
  if(!S.news[a.id]) S.news[a.id]=[];
  // earnings = bigger magnitude, a gap, and a stronger follow regime than news
  S.news[a.id].push({ id:U.uid(), t:ev.t, imp:'high', dir:dir, flavor:ev.fade?'fade':(ev.chop?'chop':'continue'), mag:1.5, ticks:0, life:U.randInt(14,26), delay:0, ts:Date.now(), earnings:1 });
  if(!S.newsFeed[a.id]) S.newsFeed[a.id]=[];
  S.newsFeed[a.id].unshift({ t:'📊 '+ev.t, imp:'high', ts:Date.now(), simMin:ms.epoch, earnings:1 });
  if(S.newsFeed[a.id].length>8) S.newsFeed[a.id].pop();
  // visible after-hours style GAP, then a stronger follow regime that the tape carries
  ms.price = ms.price * (1 + dir*U.rand(0.012,0.045)*(ev.cont?1.2:1));
  ms.regime = ev.chop ? 'liquidity_sweep' : (ev.squeeze ? (dir>0?'short_squeeze':'panic_dump') : (ev.fade ? 'news_fade' : 'high_vol_momentum'));
  ms.left=U.randInt(7,14); ms.trendDir=dir; ms.volState=Math.max(ms.volState||1, 2.8);
  stepCandle(a,false); runOrderPathForCandle(latestCandleForTrading(a.id));
  flash(dir>0?'green':'red'); fx('shock'); toast('📊 EARNINGS · '+ev.t.split('—')[0].trim());
  renderHome();
}

/* ---------- live risk patch (called during SL/TP drag, no rebuild) ---------- */
function patchRiskLive(){
  var p=S.position; if(!p) return; var a=asset(p.asset);
  var set=function(id,txt,cls){ var e=U.el(id); if(e){ e.textContent=txt; if(cls!=null) e.className=cls; } };
  var atBE = p.sl!=null && Math.abs(p.sl-p.entry) < p.entry*1e-6;
  var riskAmt = (p.sl!=null)?Math.abs(p.entry-p.sl)*p.qty:0;
  var riskPct = S.account.balance>0 ? riskAmt/S.account.balance*100 : 0;
  var rr = (p.sl!=null && p.tp!=null) ? Math.abs(p.tp-p.entry)/Math.max(1e-9,Math.abs(p.entry-p.sl)) : 0;
  set('rr-sl', atBE?'B/E':(p.sl!=null?U.fmtPrice(p.sl,a.dp):'—'));
  set('rr-tp', p.tp!=null?U.fmtPrice(p.tp,a.dp):'—');
  set('rr-risk', atBE?'break-even':(p.sl!=null?('−'+riskPct.toFixed(1)+'%'):'no stop'));
  set('rr-rr', (rr>0&&!atBE)?(rr.toFixed(1)+'R'):(atBE?'∞':'—'));
  var u=unrealized();
  var cb=document.querySelector('.tradebtns [data-act="close-pos"]'); if(cb) cb.innerHTML='CLOSE · '+U.fmtSigned(u);
  var dp=U.el('cd-pnl'); if(dp){ dp.textContent=U.fmtSigned(u); dp.className='cd-pnl '+(u>=0?'pos':'neg'); }
  var fdp=U.el('fcd-pnl'); if(fdp){ fdp.textContent=U.fmtSigned(u); fdp.className='cd-pnl '+(u>=0?'pos':'neg'); }
}

function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function ensureDaily(){
  var key=todayKey();
  if(S.daily && S.daily.date===key && S.daily.missions && S.daily.missions.length) return S.daily;
  var pool=DAILY_POOL.slice(), picks=[];
  while(picks.length<3 && pool.length){ picks.push(pool.splice(U.randInt(0,pool.length-1),1)[0]); }
  S.daily={ date:key, missions:picks.map(function(m){ return {id:m.id, prog:0, done:false}; }), allDone:false };
  return S.daily;

function dailyDef(id){ for(var i=0;i<DAILY_POOL.length;i++){ if(DAILY_POOL[i].id===id) return DAILY_POOL[i]; } return null; }
function updateDailyOnTrade(trade){
  var d=ensureDaily(), bonus=0, justDone=[];

    if(ms.done) return;
    var def=dailyDef(ms.id); if(!def) return;
    ms.prog += (def.test(trade)||0);
    if(ms.prog<0) ms.prog=0;
    if(ms.prog>=def.goal){ ms.prog=def.goal; ms.done=true; bonus+=def.xp; justDone.push(def); }
  });
  if(justDone.length){
    setTimeout(function(){ toast('✓ Daily: '+justDone[0].name+' +'+justDone[0].xp+' XP'); }, 950);
  }
  if(!d.allDone && d.missions.every(function(m){return m.done;})){ d.allDone=true; unlock('daily_sweep'); setTimeout(function(){ toast('🎯 All daily objectives cleared!'); celebrate(); },1300); }
  return bonus;
}

/* ---------- SETUP RADAR ---------- */
function setupRadar(a){
  var ms=S.market[a.id];
  if(!ms) return {name:'Scanning…', conf:0, bias:0, note:'Run the market to scan price action.'};
  var prem = ms.fair? Math.log((ms.price||a.base)/Math.max(ms.fair,1e-9)) : 0;
  var map={
    breakout:{name:'Breakout Push', bias:ms.trendDir, conf:0.62, note:'Momentum expanding — chasers risk the retest.'},
    breakout_retest:{name:'Breakout Retest', bias:ms.trendDir, conf:0.60, note:'Pullback into the level — continuation if it holds.'},
    bull_trend:{name:'Trend Continuation', bias:1, conf:0.58, note:'Buyers in control. Dips being bought.'},
    grind_trend:{name:'Grind Trend', bias:ms.trendDir, conf:0.55, note:'Slow, steady drift. Low-vol trend.'},
    bear_trend:{name:'Down Trend', bias:-1, conf:0.58, note:'Sellers control. Rallies fade.'},
    pullback:{name:'Pullback', bias:-(ms.trendDir||1), conf:0.50, note:'Counter-trend dip — possible buy-the-dip.'},
    liquidity_sweep:{name:'Liquidity Sweep', bias:0, conf:0.50, note:'Stop run likely — wait for the reclaim.'},
    failed_breakout:{name:'Failed Breakout', bias:-(ms.trendDir||1), conf:0.52, note:'Breakout rejected — fade risk both ways.'},
    consolidation:{name:'Range Compression', bias:0, conf:0.46, note:'Coiling. A breakout is building.'},
    accumulation:{name:'Accumulation', bias:1, conf:0.48, note:'Basing — quiet buying under the surface.'},
    distribution:{name:'Distribution', bias:-1, conf:0.48, note:'Topping risk — smart money offloading.'},
    low_vol_drift:{name:'Low-Volume Drift', bias:ms.trendDir, conf:0.40, note:'Thin tape — chop traps common.'},
    chop:{name:'Choppy Range', bias:0, conf:0.38, note:'No clean edge — scalps only.'},
    news_reaction:{name:'News Reaction', bias:ms.trendDir, conf:0.50, note:'Headline driving price — follow or fade.'},
    news_fade:{name:'News Fade', bias:ms.trendDir, conf:0.50, note:'Initial spike fading back.'},
    short_squeeze:{name:'Short Squeeze', bias:1, conf:0.60, note:'Forced buying — violent but fragile.'},
    panic_dump:{name:'Panic Dump', bias:-1, conf:0.60, note:'Capitulation — bounce can be sharp.'},
    high_vol_momentum:{name:'Momentum Burst', bias:ms.trendDir, conf:0.58, note:'Vol expansion — mind your size.'}
  };
  var s=map[ms.regime]||{name:REGIME_NAMES_LABEL(ms.regime), bias:ms.trendDir, conf:0.45, note:'Reading the tape.'};
  var conf=s.conf; if(Math.abs(prem)>0.06) conf=Math.max(0.34, conf-0.09);
  conf=U.clamp(conf + U.rand(-0.03,0.03), 0.3, 0.78);
  return {name:s.name, conf:conf, bias:s.bias, note:s.note};
}
function radarBiasTxt(b){ return b>0?'BULLISH':b<0?'BEARISH':'NEUTRAL'; }
function renderSetupRadar(a){

/* ---------- BOSS / EVENT MODE ---------- */
function triggerBoss(kind){
  if(S.boss){ toast('An event is already live'); return; }
  if(S.position){ toast('Close your position to start an event'); return; }
  var a=asset(S.selectedAsset);
  if(!S.market[a.id]) initMarket(a);
  if(!kind || !BOSS_META[kind]){ kind=U.pick(Object.keys(BOSS_META)); }
  var meta=BOSS_META[kind];
  S.boss={ kind:kind, asset:a.id, left:meta.life, total:meta.life, startBal:S.account.balance, bestR:0, liquidated:false, done:false, reward:meta.reward };
  var ms=S.market[a.id]; ms.left=2; ms.volState=Math.max(ms.volState||1,1.8); transitionRegime(a, ms);
  flash('amber');
  toast(meta.emoji+' '+meta.name+' — '+meta.goal);
  if(!S.running) startStop();
  renderHome();
}
function tickBoss(){
  var b=S.boss; if(!b||b.done) return;
  if(S.position && S.position.asset===b.asset){
    var uR=S.position.risk>0?unrealized()/S.position.risk:0; if(uR>b.bestR) b.bestR=uR;
  }
  b.left--;
  if(b.left<=0) resolveBoss();
  updateBossBanner();
}
function bossGoalMet(b, finalR){
  var eqUp = equity() >= b.startBal - 1e-6;
  switch(b.kind){
    case 'earnings_storm': return (finalR>=1.5) || (b.bestR>=1.5 && eqUp);
    case 'meme_squeeze':   return (finalR>=2)   || b.bestR>=2;
    case 'cpi_whipsaw':    return eqUp && !b.liquidated;
    case 'liq_cascade':    return !b.liquidated && ((finalR>=1) || eqUp);
    case 'low_volume_trap':return (finalR>=1)   || (eqUp && !b.liquidated);
  }
  return eqUp;
}
function resolveBoss(){ var b=S.boss; if(!b||b.done) return; b.done=true; finishBoss(bossGoalMet(b, b.bestR)); }
function resolveBossOnClose(trade){
  var b=S.boss; if(!b||b.done) return; if(trade.asset!==b.asset) return;
  if(trade.reason==='liq') b.liquidated=true;
  if(bossGoalMet(b, trade.r)){ b.done=true; finishBoss(true); }
}
function finishBoss(met){
  var b=S.boss; if(!b) return; var meta=BOSS_META[b.kind];
  if(met){
    var res=grantXp(b.reward); S.bossLog[b.kind]=(S.bossLog[b.kind]||0)+1;
    unlock('boss_slayer');
    var total=0; Object.keys(S.bossLog).forEach(function(k){ total+=S.bossLog[k]; });
    if(total>=5) unlock('boss_master');
    toast('🏆 '+meta.name+' cleared! +'+b.reward+' XP'); celebrate();
    if(res.leveledTo) levelUpFx(res.leveledTo);
  } else {
    toast(meta.emoji+' '+meta.name+' ended — no reward this time','bad');
  }
  S.boss=null; saveSoon();
  if(_active==='home') renderHome();
}
function renderBossBanner(){

/* ---------- TRADE RECAP CARD ---------- */
function disciplineGradeForTrade(t){
  var score=70;
  if(t.hadSL) score+=14; else score-=22;
  if(t.slWidened) score-=20;
  if(t.reason==='tp') score+=10;
  if(t.reason==='liq') score-=30;
  if(t.win) score+=6;
  if(t.r>=2) score+=6;
  // gave back a big winner?
  if(t.mfeR>=1.5 && t.r<0.4) score-=12;
  score=U.clamp(score,0,100);
  var g = score>=90?'A+':score>=82?'A':score>=72?'B':score>=60?'C':score>=45?'D':'F';
  return {score:score, grade:g};
}
function tradeLesson(t, g){
  if(t.reason==='liq') return 'Liquidated — size smaller or set a real stop next time.';
  if(t.slWidened && !t.win) return 'Stop was widened — that turned a small loss into a bigger one.';
  if(t.slWidened && t.win) return 'You moved your stop and got lucky — discipline beats luck long-term.';
  if(t.reason==='tp') return 'Clean take-profit hit. Textbook execution.';
  if(!t.hadSL) return 'No stop on this one — protect your downside every trade.';
  if(t.win && t.r>=2) return 'Big winner with risk defined. This is the model trade.';
  if(t.win) return 'Solid win with a stop in place. Repeatable.';
  if(t.mfeR>=1.5 && t.r<0) return 'You were up '+t.mfeR.toFixed(1)+'R before this turned red — consider banking partials.';
  if(t.reason==='sl') return 'Stop respected. Small, controlled loss — exactly how it should work.';
  return 'Loss taken cleanly. On to the next setup.';
}

/* ---- V12.1 OPTIONAL HAPTICS + SOUND (browser-safe, default off, fails silently) ---- */
var _audioCtx=null;
function ensureAudio(){
  if(_audioCtx) return _audioCtx;
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC) _audioCtx=new AC(); }catch(e){}
  return _audioCtx;
}
function beep(freq,dur,type,vol){
  if(!S.settings || !S.settings.sound) return;
  var ctx=ensureAudio(); if(!ctx) return;
  try{
    if(ctx.state==='suspended'){ ctx.resume(); }
    var o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime;
    o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol||0.07,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12));
    o.start(t); o.stop(t+(dur||0.12)+0.03);
  }catch(e){}
}
function vibrate(pattern){
  if(!S.settings || !S.settings.haptics) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
function fx(kind){
  try{
    switch(kind){
      case 'open': beep(520,0.09,'sine',0.05); vibrate(8); break;
      case 'win': beep(660,0.10,'sine',0.07); setTimeout(function(){beep(880,0.12,'sine',0.07);},90); vibrate([10,28,12]); break;
      case 'loss': beep(300,0.14,'sawtooth',0.05); vibrate(18); break;
      case 'tp': beep(740,0.10,'triangle',0.07); setTimeout(function(){beep(988,0.12,'triangle',0.07);},80); vibrate([8,22,10]); break;
      case 'sl': beep(280,0.16,'sawtooth',0.05); vibrate(22); break;
      case 'liq': beep(170,0.30,'sawtooth',0.08); vibrate([20,40,20,40]); break;
      case 'shock': beep(420,0.08,'square',0.04); setTimeout(function(){beep(620,0.10,'square',0.04);},60); vibrate([6,16,8]); break;
      case 'achv': beep(784,0.10,'sine',0.06); setTimeout(function(){beep(1175,0.14,'sine',0.06);},100); vibrate([10,28,10,28]); break;
    }
  }catch(e){}
}

    return '<button class="pm-row '+(m.id===cur?'active':'')+'" data-act="set-practice" data-mode="'+m.id+'">'+
      '<span class="pm-ic">'+(ICON[m.icon]||ICON.target).replace('<svg','<svg width="17" height="17"')+'</span>'+
      '<div class="pm-mid"><div class="pm-nm">'+m.name+'</div><div class="pm-ds">'+m.desc+'</div></div>'+
      (m.id===cur?'<span class="pm-on">ACTIVE</span>':'')+'</button>';
  }).join('');
  openModal('<h3>Practice Focus</h3><div class="sd">Pick a style. This tunes your daily objectives and the vibe of your session — it never changes the market itself.</div><div class="pm-list">'+rows+'</div><div class="btnrow"><button class="btn ghost" data-act="close-modal">Done</button></div>');
}

/* ---------- 26. INIT / BOOT ---------- */
function ensureSelectedMarket(){
  var id=S.selectedAsset;
  if(!ASSET_MAP[id]){ S.selectedAsset='BTCUSD'; id='BTCUSD'; }
  if(!S.candles[id] || S.candles[id].length<5 || !S.market[id]){
    initMarket(asset(id));
  }
  ensureDeepHistory(asset(id), SEED_CANDLES);  // rich history so 0.25x zoom-out is meaningful
  // make sure watchlist + featured assets have seed data for ticker/watchlist prices
  getWatchlist().forEach(function(wid){ if(!S.market[wid]) initMarket(asset(wid), 130); });
  FEATURED.forEach(function(fid){ if(!S.market[fid]) initMarket(asset(fid), 130); });
}
function rehydrateRuntime(){
  // recompute transient discipline trackers from stored trades
  _recentOpens=[];
  if(S._resetPnL==null) S._resetPnL=0;
  // re-seed weekly window if stale
  var st=S.stats;
  if(!st.weekStartTs) st.weekStartTs=Date.now();
}
function bootCommon(){
  rehydrateRuntime();
  ensureSelectedMarket();
  renderNav();
  // build all screens once
  renderHome(); renderChallenges(); renderLeaderboard(); renderSocial(); renderProfile();
  switchScreen('home');
  setupChartObserver();
  ensureLoop();
  // render chart a few times as layout settles on mobile
  setTimeout(renderChart,40);
  setTimeout(renderChart,180);
  setTimeout(renderChart,500);
}
function bootFresh(){
  S=defaultState(); S._resetPnL=0;
  ensureSelectedMarket();
  save();
  bootCommon();
}
var _bootTs=Date.now();
function hideSplash(){
  var sp=document.getElementById('splash'); if(!sp) return;
  var wait=Math.max(0, 820-(Date.now()-_bootTs)); // ensure splash shows ~0.8s minimum
  setTimeout(function(){ sp.classList.add('hide'); setTimeout(function(){ if(sp&&sp.parentNode) sp.parentNode.removeChild(sp); }, 650); }, wait);
}
function rotateSplashTag(){
  var el=document.getElementById('sp-tag'); if(!el) return;
  var lines=['Warming the tape…','Loading synthetic markets…','Calibrating volatility…','Seeding the order book…'];
  var i=0; var iv=setInterval(function(){ var e=document.getElementById('sp-tag'); if(!e){ clearInterval(iv); return;} i=(i+1)%lines.length; e.textContent=lines[i]; }, 380);
}
function boot(){
  rotateSplashTag();
  try{
    var ok=load();
    if(!ok){ S=defaultState(); S._resetPnL=0; ensureSelectedMarket(); save(); }
    bootCommon();
    setInterval(function(){ if(_active==='home') updateShockButtons(); }, 500);
    // friendly note if opened from a known raw-code host (rare: usually won't run JS at all)
    try{ if(/raw\.githubusercontent\.com$/.test(location.hostname)){ setTimeout(function(){ toast('Tip: open via the githack play link for the best experience'); }, 1600); } }catch(e){}
    if(!ok){
      setTimeout(function(){ showCoach(); }, 500);   // first-run onboarding
    } else {
      setTimeout(function(){ toast('Welcome back — press RUN to resume the market'); }, 900);
    }
  }catch(e){
    // never leave a blank screen: surface the error and still drop the splash
    try{ showError('Boot error: '+(e&&e.message?e.message:e)); }catch(_){}
    try{ var eb=document.getElementById('error-banner'); if(eb) eb.style.display='block'; }catch(_){}
  }
  hideSplash();
}

/* ---------- first-run onboarding coach ---------- */
function showCoach(){
  if(document.getElementById('coach')) return;
  var steps=[
    ['This is <b>synthetic practice trading</b>','No real money, ever. Just you vs. the tape.'],
    ['Press <b>RUN</b> to start the market','Candles start forming in real time.'],
    ['Tap <b>Long</b> or <b>Short</b>','Long if you think it goes up, Short if down.'],
    ['Manage your risk','Set a stop & target, or hit Close before liquidation.'],
    ['Climb the ladder','Complete challenges & dailies. Leaderboards are local/demo for now.']
  ];
  var html='<div id="coach"><div class="co-card">'+
    '<div class="co-badge">'+(typeof rankShield==='function'?rankShield(54,'#19e98c'):'')+'</div>'+
    '<h3>Welcome to CandleRun</h3><div class="co-sub">60-second crash course 👇</div>'+
    '<div class="co-steps">'+steps.map(function(s,i){return '<div class="co-step"><span class="co-n">'+(i+1)+'</span><div><b>'+s[0]+'</b><br><span>'+s[1]+'</span></div></div>';}).join('')+'</div>'+
    '<div class="co-note">Markets, names & events are fictional and for entertainment only.</div>'+
    '<div class="btnrow"><button class="btn primary" data-act="coach-done">Let’s trade ▸</button></div>'+
    '</div></div>';
  var d=document.createElement('div'); d.innerHTML=html; document.body.appendChild(d.firstChild);
}
function closeCoach(){ var c=document.getElementById('coach'); if(c&&c.parentNode) c.parentNode.removeChild(c); }

/* ---------- share / save export-import ---------- */
function shareGame(){
  var url=(location && location.href) ? location.href.split('#')[0] : 'CandleRun';
  var done=function(){ toast('Link copied — send it to your trading menace 📈'); };
  try{
    if(navigator.share){ navigator.share({title:'CandleRun', text:'Come trade the tape with me on CandleRun (synthetic practice game):', url:url}).catch(function(){}); return; }
  }catch(e){}
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done, function(){ legacyCopy(url); done(); }); }
    else { legacyCopy(url); done(); }
  }catch(e){ legacyCopy(url); done(); }
}
function legacyCopy(text){
  try{ var t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.focus(); t.select(); document.execCommand('copy'); document.body.removeChild(t); }catch(e){}
}
function exportSave(){
  try{
    var raw=localStorage.getItem(SAVE_KEY)||JSON.stringify(S);
    legacyCopy(raw);
    openModal('<h3>Export Save</h3><div class="sd">Your save (JSON) is copied to the clipboard. Paste it somewhere safe — you can re-import it later or on another device.</div>'+
      '<textarea class="savebox" readonly onclick="this.select()">'+U.esc(raw)+'</textarea>'+
      '<div class="btnrow"><button class="btn ghost" data-act="close-modal">Done</button></div>');
  }catch(e){ toast('Export failed'); }
}
function openImportSave(){
  openModal('<h3>Import Save</h3><div class="sd">Paste a previously exported CandleRun save below. This replaces your current local progress.</div>'+
    '<textarea class="savebox" id="importbox" placeholder="Paste your save JSON here…"></textarea>'+
    '<div class="btnrow"><button class="btn primary" data-act="do-import-save">Import</button><button class="btn ghost" data-act="close-modal">Cancel</button></div>');
}
function doImportSave(){
  var box=document.getElementById('importbox'); if(!box){ return; }
  var txt=(box.value||'').trim(); if(!txt){ toast('Paste a save first'); return; }
  try{
    var parsed=JSON.parse(txt);
    if(!parsed||typeof parsed!=='object') throw new Error('not an object');
    localStorage.setItem(SAVE_KEY, JSON.stringify(parsed));
    closeModal(); toast('Save imported ✓ reloading…');
    setTimeout(function(){ location.reload(); }, 700);
  }catch(e){ toast('That doesn’t look like a valid save'); }
}

/* re-render chart on orientation / resize / visibility */
window.addEventListener('resize', function(){ if(_active==='home') renderChart(); });
window.addEventListener('orientationchange', function(){ setTimeout(function(){ if(_active==='home') renderChart(); },250); });
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ save(); }
  else { loop.last=0; if(_active==='home') renderChart(); }
});
window.addEventListener('pagehide', save);
window.addEventListener('beforeunload', save);

/* global tap feedback — tiny visual "haptic" on any control */
document.addEventListener('pointerdown', function(e){
  var t=e.target&&e.target.closest?e.target.closest('button,[data-act]'):null;
  if(!t) return;
  var f=document.createElement('div'); f.className='tapflash'; f.style.left=e.clientX+'px'; f.style.top=e.clientY+'px';
  document.body.appendChild(f); setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 420);
}, {passive:true});

/* GO */
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); }
else { boot(); }
// hard fallback: if something blocked boot, never leave the splash stuck
setTimeout(function(){ var sp=document.getElementById('splash'); if(sp && !sp.classList.contains('hide')) hideSplash(); }, 4000);

</script>
