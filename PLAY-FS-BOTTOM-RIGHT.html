<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04070b">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>CandleRun — Bottom Right Fullscreen Controls</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070b;color:#e9f2ef;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#04070b}
    #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(90% 55% at 50% 0%,rgba(25,233,140,.14),transparent 58%),#04070b;z-index:5;transition:opacity .25s ease}
    #boot.hide{opacity:0;pointer-events:none}
    .card{max-width:430px;border:1px solid rgba(120,255,205,.18);border-radius:26px;background:linear-gradient(160deg,rgba(16,28,39,.96),rgba(7,11,17,.98));padding:26px;box-shadow:0 22px 70px rgba(0,0,0,.55),0 0 40px rgba(25,233,140,.10);text-align:left}
    h1{margin:0;font-size:40px;line-height:.9;font-style:italic} h1 span{color:#19e98c;text-shadow:0 0 20px rgba(25,233,140,.35)}
    p{color:#9aa7ad;line-height:1.45;font-size:14px}.tiny{font-size:12px;color:#6f7d84}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:12px;padding:14px 18px;border-radius:16px;text-decoration:none;font-weight:900;border:1px solid rgba(120,255,205,.18);background:linear-gradient(180deg,#2bffaa,#10c87a);color:#02150f}
  </style>
</head>
<body>
  <iframe id="game" src="CandleRun%20V9%20GOAT%20Trading%20Game%205.html?layout=fs-info-dock-v15" title="CandleRun Game"></iframe>
  <div id="boot"><div class="card"><h1>CANDLE<span>RUN</span></h1><p>Loading V15: fullscreen dock keeps trade info plus three equal buttons: Close, SL→BE, and fullscreen exit.</p><a class="btn" href="CandleRun%20V9%20GOAT%20Trading%20Game%205.html?layout=fs-info-dock-v15">Open direct file if needed</a><p class="tiny">Fresh cache-busted layout with trade info restored in the dock.</p></div></div>
<script>
(function(){
  var frame=document.getElementById('game');
  var boot=document.getElementById('boot');
  var patchedRender=false;
  var styleInjected=false;
  var listenerInjected=false;
  function child(){ try{return frame.contentWindow;}catch(e){return null;} }
  function childDoc(){ var w=child(); try{return w&&w.document;}catch(e){return null;} }
  function placeEnterButtonInChartControls(){
    var d=childDoc();
    if(!d||!d.body) return false;
    var badges=d.querySelectorAll('#patchBadge,[data-candlerun-patch-badge],.patchBadge,.patch-badge');
    badges.forEach(function(b){ try{b.remove();}catch(e){b.style.display='none';} });
    var host=d.querySelector('#chart-host');
    var bar=d.querySelector('.chart-uxbar');
    var btn=(host&&host.querySelector('.chart-fsbtn')) || (bar&&bar.querySelector('.chart-fsbtn')) || d.querySelector('.chart-fsbtn');
    if(!host||!btn) return false;
    btn.setAttribute('title', d.body.classList.contains('fs-chart')?'Exit fullscreen chart':'Fullscreen chart');
    btn.setAttribute('aria-label', d.body.classList.contains('fs-chart')?'Exit fullscreen chart':'Fullscreen chart');
    if(d.body.classList.contains('fs-chart')){
      if(btn.parentElement!==host) host.appendChild(btn);
    }else if(bar){
      btn.setAttribute('data-in-uxbar','true');
      if(btn.parentElement!==bar) bar.appendChild(btn);
    }
    return true;
  }
  function patchInsideGame(){
    var w=child(), d=childDoc();
    if(!w||!d||!d.body) return false;
    if(!styleInjected && d.head){
      var st=d.createElement('style');
      st.setAttribute('data-candlerun-layout-patch','fs-info-dock-v15');
      st.textContent=[
        '/* V15: normal enter fullscreen in bottom-right chart controls; fullscreen dock restores old trade info and keeps 3 equal action buttons */',
        '#patchBadge,[data-candlerun-patch-badge],.patchBadge,.patch-badge{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;}',
        '.chart-uxbar{right:10px!important;bottom:8px!important;max-width:calc(100% - 20px)!important;z-index:12!important;display:flex!important;align-items:center!important;gap:7px!important;padding:5px 7px!important;border-radius:14px!important;}',
        '.chart-uxbar .gesture{min-width:0!important;max-width:150px!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;}',
        '.chart-uxbar .chart-reset{flex:0 0 auto!important;padding:8px 11px!important;border-radius:12px!important;}',
        '.chart-uxbar .chart-fsbtn{position:static!important;inset:auto!important;flex:0 0 42px!important;width:42px!important;height:42px!important;margin:0!important;border-radius:15px!important;display:flex!important;align-items:center!important;justify-content:center!important;pointer-events:auto!important;touch-action:manipulation!important;background:linear-gradient(180deg,rgba(9,28,32,.88),rgba(3,10,15,.78))!important;border:1px solid rgba(150,255,220,.34)!important;box-shadow:0 8px 22px rgba(0,0,0,.36),0 0 16px rgba(25,233,140,.10),inset 0 1px 0 rgba(255,255,255,.04)!important;backdrop-filter:blur(10px)!important;}',
        '.chart-uxbar .chart-fsbtn svg{width:19px!important;height:19px!important;stroke:#d9fff1!important;}',
        '#chart-host > .chart-fsbtn:not([data-in-uxbar="true"]){right:10px!important;bottom:8px!important;top:auto!important;left:auto!important;width:42px!important;height:42px!important;border-radius:15px!important;z-index:12!important;}',
        'body.fs-chart .chart-uxbar{display:none!important;}',
        'body.fs-chart #chart-host > .chart-fsbtn{display:none!important;visibility:hidden!important;pointer-events:none!important;}',
        'body.fs-chart .fs-dock{left:8px!important;right:8px!important;bottom:calc(var(--safe-bot) + 8px)!important;z-index:40!important;display:grid!important;grid-template-columns:repeat(6,1fr)!important;grid-template-areas:"dir dir mark mark pnl r" "close close be be exit exit" "info info info info info info"!important;align-items:center!important;gap:7px!important;padding:9px 10px!important;border-radius:18px!important;background:rgba(4,10,15,.86)!important;border:1px solid rgba(150,255,220,.16)!important;box-shadow:0 10px 28px rgba(0,0,0,.42)!important;}',
        'body.fs-chart .fs-dock .cd-dir{grid-area:dir!important;display:flex!important;align-items:center!important;justify-content:center!important;min-height:28px!important;border-radius:999px!important;font-size:10px!important;font-weight:900!important;letter-spacing:.5px!important;white-space:nowrap!important;}',
        'body.fs-chart .fs-dock .fd-mk{grid-area:mark!important;display:block!important;text-align:center!important;min-width:0!important;font-size:11px!important;font-weight:800!important;color:rgba(207,224,230,.70)!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}',
        'body.fs-chart .fs-dock #fcd-pnl{grid-area:pnl!important;display:block!important;text-align:right!important;min-width:0!important;font-size:15px!important;font-weight:950!important;font-family:ui-monospace,monospace!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}',
        'body.fs-chart .fs-dock #fcd-r{grid-area:r!important;display:block!important;text-align:left!important;min-width:0!important;font-size:11px!important;font-weight:900!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;opacity:.95!important;}',
        'body.fs-chart .fs-dock .close{grid-area:close!important;width:100%!important;min-height:50px!important;margin:0!important;border-radius:14px!important;font-size:15px!important;}',
        'body.fs-chart .fs-dock .be{grid-area:be!important;width:100%!important;min-height:50px!important;margin:0!important;border-radius:14px!important;font-size:14px!important;justify-self:stretch!important;}',
        'body.fs-chart .fs-dock .fsx{grid-area:exit!important;display:flex!important;visibility:visible!important;pointer-events:auto!important;width:100%!important;min-height:50px!important;margin:0!important;padding:0 12px!important;align-items:center!important;justify-content:center!important;border-radius:16px!important;color:#d9fff1!important;background:linear-gradient(180deg,rgba(9,28,32,.90),rgba(3,10,15,.82))!important;border:1px solid rgba(150,255,220,.34)!important;box-shadow:0 7px 18px rgba(0,0,0,.34),0 0 14px rgba(25,233,140,.10)!important;}',
        'body.fs-chart .fs-dock .fsx svg{width:22px!important;height:22px!important;stroke:currentColor!important;}',
        'body.fs-chart .fsd-info{grid-area:info!important;max-width:100%!important;min-width:0!important;text-align:center!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;font-size:10px!important;color:rgba(207,224,230,.58)!important;}',
        '@media(max-width:430px){.chart-uxbar{right:8px!important;bottom:8px!important;gap:5px!important;padding:4px 5px!important;}.chart-uxbar .gesture{max-width:76px!important;font-size:7.6px!important;}.chart-uxbar .chart-reset{font-size:8.8px!important;padding:7px 8px!important;}.chart-uxbar .chart-fsbtn{flex-basis:38px!important;width:38px!important;height:38px!important;border-radius:14px!important;}.chart-uxbar .chart-fsbtn svg{width:18px!important;height:18px!important;}body.fs-chart .fs-dock{bottom:calc(var(--safe-bot) + 7px)!important;padding:8px 9px!important;gap:6px!important;}body.fs-chart .fs-dock .cd-dir{font-size:9.5px!important;}body.fs-chart .fs-dock .fd-mk{font-size:10px!important;}body.fs-chart .fs-dock #fcd-pnl{font-size:13.5px!important;}body.fs-chart .fs-dock #fcd-r{font-size:10px!important;}body.fs-chart .fs-dock .close,body.fs-chart .fs-dock .be,body.fs-chart .fs-dock .fsx{min-height:48px!important;}}'
      ].join('\n');
      d.head.appendChild(st);
      styleInjected=true;
    }
    placeEnterButtonInChartControls();
    if(!listenerInjected){
      try{
        d.addEventListener('pointerdown',function(ev){
          var btn=ev.target&&ev.target.closest&&ev.target.closest('.chart-fsbtn');
          if(!btn) return;
          ev.preventDefault();
          ev.stopPropagation();
          try{
            if(typeof w.toggleChartFs==='function') w.toggleChartFs();
            else if(typeof w.handleAction==='function') w.handleAction('chart-fullscreen',{},btn);
            setTimeout(placeEnterButtonInChartControls,20);
            if(typeof w.renderChart==='function') setTimeout(function(){try{w.renderChart();placeEnterButtonInChartControls();}catch(e){}},45);
          }catch(e){}
        },true);
        listenerInjected=true;
      }catch(e){}
    }
    if(!patchedRender && typeof w.renderChart==='function'){
      try{
        var src=String(w.renderChart);
        var next=src.replace(/var\s+futureSlots\s*=\s*[0-9.]+\s*;/,'var futureSlots=2.35;');
        if(next!==src){
          w.eval('renderChart = '+next);
          patchedRender=true;
          if(typeof w.renderChart==='function') w.renderChart();
        }
      }catch(e){}
    }
    placeEnterButtonInChartControls();
    return true;
  }
  frame.addEventListener('load',function(){
    setTimeout(function(){boot.classList.add('hide');},500);
    patchInsideGame();
    setTimeout(patchInsideGame,120);
    setTimeout(patchInsideGame,350);
    setTimeout(patchInsideGame,900);
  });
  window.addEventListener('resize',patchInsideGame);
  window.addEventListener('orientationchange',function(){setTimeout(patchInsideGame,250);});
  setInterval(patchInsideGame,250);
})();
</script>
</body>
</html>
