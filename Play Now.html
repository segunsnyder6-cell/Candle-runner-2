<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04070b">
  <title>CandleRun — Play Now</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070b;color:#e9f2ef;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#04070b}
    #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(90% 55% at 50% 0%,rgba(25,233,140,.14),transparent 58%),#04070b;z-index:5;transition:opacity .25s ease}
    #boot.hide{opacity:0;pointer-events:none}
    .card{max-width:430px;border:1px solid rgba(120,255,205,.18);border-radius:26px;background:linear-gradient(160deg,rgba(16,28,39,.96),rgba(7,11,17,.98));padding:26px;box-shadow:0 22px 70px rgba(0,0,0,.55),0 0 40px rgba(25,233,140,.10);text-align:left}
    h1{margin:0;font-size:40px;line-height:.9;font-style:italic} h1 span{color:#19e98c;text-shadow:0 0 20px rgba(25,233,140,.35)}
    p{color:#9aa7ad;line-height:1.45;font-size:14px}.tiny{font-size:12px;color:#6f7d84}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:12px;padding:14px 18px;border-radius:16px;text-decoration:none;font-weight:900;border:1px solid rgba(120,255,205,.18);background:linear-gradient(180deg,#2bffaa,#10c87a);color:#02150f}
    #patchBadge{position:fixed;left:10px;bottom:10px;z-index:999998;padding:7px 10px;border-radius:999px;background:rgba(3,10,15,.70);border:1px solid rgba(120,255,205,.16);color:#9aa7ad;font-size:11px;font-weight:800;backdrop-filter:blur(10px);pointer-events:none;opacity:.72}
  </style>
</head>
<body>
  <iframe id="game" src="CandleRun%20V9%20GOAT%20Trading%20Game%205.html?v=v12-4-single-fullscreen" title="CandleRun Game"></iframe>
  <div id="boot"><div class="card"><h1>CANDLE<span>RUN</span></h1><p>Loading the updated Play Now build with the cleaner single fullscreen button and right-shifted live candle patch…</p><a class="btn" href="CandleRun%20V9%20GOAT%20Trading%20Game%205.html?v=v12-4-single-fullscreen">Open direct file if needed</a><p class="tiny">This page renders the game. GitHub's file list will still show code if you tap the file directly.</p></div></div>
  <div id="patchBadge">V12.4 single fullscreen patch active</div>
<script>
(function(){
  var frame=document.getElementById('game');
  var boot=document.getElementById('boot');
  var patchedRender=false;
  var styleInjected=false;
  var listenerInjected=false;
  function child(){ try{return frame.contentWindow;}catch(e){return null;} }
  function childDoc(){ var w=child(); try{return w&&w.document;}catch(e){return null;} }
  function patchInsideGame(){
    var w=child(), d=childDoc();
    if(!w||!d||!d.body) return false;
    if(!styleInjected && d.head){
      var st=d.createElement('style');
      st.setAttribute('data-candlerun-mobile-patch','v12.4-single-fs');
      st.textContent=[
        '/* CandleRun V12.4 launcher patch: one reliable fullscreen button, bottom chart control area */',
        '.chart-fsbtn{top:auto!important;right:8px!important;bottom:8px!important;z-index:99999!important;width:46px!important;height:46px!important;border-radius:15px!important;pointer-events:auto!important;touch-action:manipulation!important;background:linear-gradient(180deg,rgba(8,24,28,.92),rgba(3,10,15,.88))!important;border:1px solid rgba(150,255,220,.34)!important;box-shadow:0 10px 26px rgba(0,0,0,.42),0 0 20px rgba(25,233,140,.16)!important;}',
        '.chart-fsbtn svg{width:21px!important;height:21px!important;}',
        '.chart-uxbar{right:62px!important;bottom:8px!important;max-width:calc(100% - 78px)!important;z-index:8!important;}',
        '.chart-uxbar .gesture{max-width:132px!important;overflow:hidden!important;text-overflow:ellipsis!important;}',
        '#chart-host .chart-fsbtn,#chart-host [data-ui-control]{pointer-events:auto!important;}',
        '@media(max-width:430px){.chart-fsbtn{right:8px!important;bottom:8px!important;width:46px!important;height:46px!important;}.chart-uxbar{right:62px!important;bottom:8px!important;}.chart-uxbar .gesture{max-width:96px!important;}}',
        'body.fs-chart .chart-fsbtn{top:calc(var(--safe-top) + 8px)!important;right:8px!important;bottom:auto!important;}',
        'body.fs-chart .chart-uxbar{display:none!important;}'
      ].join('\n');
      d.head.appendChild(st);
      styleInjected=true;
    }
    if(!listenerInjected){
      try{
        d.addEventListener('pointerdown',function(ev){
          var btn=ev.target&&ev.target.closest&&ev.target.closest('.chart-fsbtn');
          if(!btn) return;
          ev.preventDefault();
          ev.stopPropagation();
          try{
            if(typeof w.toggleChartFs==='function') w.toggleChartFs();
            else if(typeof w.handleAction==='function') w.handleAction('chart-fullscreen',{},btn);
            if(typeof w.renderChart==='function') setTimeout(function(){try{w.renderChart();}catch(e){}},40);
          }catch(e){}
        },true);
        listenerInjected=true;
      }catch(e){}
    }
    if(!patchedRender && typeof w.renderChart==='function'){
      try{
        var src=String(w.renderChart);
        var next=src.replace(/var\s+futureSlots\s*=\s*[0-9.]+\s*;/,'var futureSlots=2.35;');
        if(next!==src){
          w.eval('renderChart = '+next);
          patchedRender=true;
          if(typeof w.renderChart==='function') w.renderChart();
        }
      }catch(e){}
    }
    return true;
  }
  frame.addEventListener('load',function(){
    setTimeout(function(){boot.classList.add('hide');},500);
    patchInsideGame();
    setTimeout(patchInsideGame,150);
    setTimeout(patchInsideGame,450);
  });
  window.addEventListener('resize',patchInsideGame);
  window.addEventListener('orientationchange',function(){setTimeout(patchInsideGame,250);});
  setInterval(patchInsideGame,500);
})();
</script>
</body>
</html>
