<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04070b">
  <title>CandleRun — Play Now</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070b;color:#e9f2ef;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#04070b}
    #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(90% 55% at 50% 0%,rgba(25,233,140,.14),transparent 58%),#04070b;z-index:5;transition:opacity .25s ease}
    #boot.hide{opacity:0;pointer-events:none}
    .card{max-width:430px;border:1px solid rgba(120,255,205,.18);border-radius:26px;background:linear-gradient(160deg,rgba(16,28,39,.96),rgba(7,11,17,.98));padding:26px;box-shadow:0 22px 70px rgba(0,0,0,.55),0 0 40px rgba(25,233,140,.10);text-align:left}
    h1{margin:0;font-size:40px;line-height:.9;font-style:italic} h1 span{color:#19e98c;text-shadow:0 0 20px rgba(25,233,140,.35)}
    p{color:#9aa7ad;line-height:1.45;font-size:14px}.tiny{font-size:12px;color:#6f7d84}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:12px;padding:14px 18px;border-radius:16px;text-decoration:none;font-weight:900;border:1px solid rgba(120,255,205,.18);background:linear-gradient(180deg,#2bffaa,#10c87a);color:#02150f}
  </style>
</head>
<body>
  <iframe id="game" src="CandleRun%20V9%20GOAT%20Trading%20Game%205.html?v=v12-12-bottom-right-fs" title="CandleRun Game"></iframe>
  <div id="boot"><div class="card"><h1>CANDLE<span>RUN</span></h1><p>Loading the newest playable build. The normal fullscreen button is forced into the bottom-right chart controls area, exactly beside Reset View, instead of floating at the top-right.</p><a class="btn" href="CandleRun%20V9%20GOAT%20Trading%20Game%205.html?v=v12-12-bottom-right-fs">Open direct game file if needed</a><p class="tiny">Use the RawGithack Play Now link to play. GitHub itself shows code.</p></div></div>
<script>
(function(){
  var frame=document.getElementById('game');
  var boot=document.getElementById('boot');
  var patchedRender=false;
  var styleInjected=false;
  var listenerInjected=false;
  var moStarted=false;
  function child(){ try{return frame.contentWindow;}catch(e){return null;} }
  function childDoc(){ var w=child(); try{return w&&w.document;}catch(e){return null;} }
  function svgIcon(kind){
    if(kind==='compress') return '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h3a1 1 0 001-1V5"/><path d="M19 9h-3a1 1 0 01-1-1V5"/><path d="M5 15h3a1 1 0 011 1v3"/><path d="M19 15h-3a1 1 0 00-1 1v3"/></svg>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M16 3h3a2 2 0 012 2v3"/><path d="M8 21H5a2 2 0 01-2-2v-3"/><path d="M16 21h3a2 2 0 002-2v-3"/></svg>';
  }
  function imp(el, prop, val){ try{ el.style.setProperty(prop,val,'important'); }catch(e){ try{el.style[prop]=val;}catch(_){} } }
  function findNormalFsButton(d, host){
    var direct=host&&host.querySelector('.chart-fsbtn');
    if(direct) return direct;
    var all=[].slice.call(d.querySelectorAll('.chart-fsbtn,[data-act="chart-fullscreen"]'));
    for(var i=0;i<all.length;i++){
      if(!all[i].closest('.fs-dock') && !all[i].classList.contains('fsx')) return all[i];
    }
    return null;
  }
  function styleSmallGlassButton(btn, compress){
    btn.classList.add('chart-fsbtn');
    btn.setAttribute('data-act','chart-fullscreen');
    btn.setAttribute('title', compress?'Exit fullscreen chart':'Fullscreen chart');
    btn.setAttribute('aria-label', compress?'Exit fullscreen chart':'Fullscreen chart');
    btn.innerHTML=svgIcon(compress?'compress':'expand');
    imp(btn,'width','48px'); imp(btn,'height','43px'); imp(btn,'min-width','48px'); imp(btn,'min-height','43px');
    imp(btn,'display','flex'); imp(btn,'align-items','center'); imp(btn,'justify-content','center');
    imp(btn,'border-radius','16px'); imp(btn,'padding','0'); imp(btn,'pointer-events','auto'); imp(btn,'touch-action','manipulation');
    imp(btn,'color','#d9fff1'); imp(btn,'background','linear-gradient(180deg,rgba(16,39,43,.96),rgba(4,14,18,.90))');
    imp(btn,'border','1px solid rgba(150,255,220,.38)');
    imp(btn,'box-shadow','0 10px 22px rgba(0,0,0,.40),0 0 16px rgba(25,233,140,.15),inset 0 1px 0 rgba(255,255,255,.07)');
    imp(btn,'backdrop-filter','blur(12px)'); imp(btn,'-webkit-backdrop-filter','blur(12px)');
    var svg=btn.querySelector('svg'); if(svg){ imp(svg,'width','23px'); imp(svg,'height','23px'); imp(svg,'stroke','currentColor'); }
  }
  function tuneDockClasses(d){
    var dock=d&&d.querySelector&&d.querySelector('.fs-dock');
    if(!dock) return;
    dock.classList.toggle('flat', !!dock.querySelector('.fsd-buy,.fsd-sell'));
    dock.classList.toggle('has-pos', !!dock.querySelector('.cd-dir'));
    var exit=dock.querySelector('.fsx.exit') || dock.querySelector('.fsx');
    if(exit){
      exit.classList.add('exit','dock-exit');
      exit.setAttribute('title','Exit fullscreen chart');
      exit.setAttribute('aria-label','Exit fullscreen chart');
      exit.innerHTML=svgIcon('compress');
      dock.appendChild(exit);
    }
  }
  function forceBottomRightFsButton(){
    var d=childDoc();
    if(!d||!d.body) return false;
    var host=d.querySelector('#chart-host');
    if(!host) return false;
    var inFs=d.body.classList.contains('fs-chart');
    var uxbar=d.querySelector('.chart-uxbar');
    var btn=findNormalFsButton(d, host);
    if(btn){
      if(!inFs){
        if(btn.parentElement!==host) host.appendChild(btn);
        styleSmallGlassButton(btn,false);
        btn.classList.remove('dock-hidden-fsbtn');
        imp(btn,'position','absolute');
        imp(btn,'top','auto'); imp(btn,'bottom','12px'); imp(btn,'right','12px'); imp(btn,'left','auto');
        imp(btn,'z-index','70'); imp(btn,'opacity','1'); imp(btn,'visibility','visible');
      }else{
        imp(btn,'display','none'); imp(btn,'visibility','hidden'); imp(btn,'opacity','0'); imp(btn,'pointer-events','none');
      }
    }
    if(uxbar){
      if(!inFs){
        imp(uxbar,'display','grid'); imp(uxbar,'position','absolute');
        imp(uxbar,'left','132px'); imp(uxbar,'right','66px'); imp(uxbar,'bottom','12px'); imp(uxbar,'top','auto');
        imp(uxbar,'width','auto'); imp(uxbar,'max-width','none'); imp(uxbar,'z-index','60');
        imp(uxbar,'grid-template-columns','minmax(0,1fr) auto'); imp(uxbar,'align-items','center'); imp(uxbar,'gap','7px');
        imp(uxbar,'padding','6px 7px 6px 12px'); imp(uxbar,'border-radius','18px');
        imp(uxbar,'background','linear-gradient(160deg,rgba(7,18,22,.82),rgba(2,8,12,.78))');
        imp(uxbar,'border','1px solid rgba(150,255,220,.17)');
        imp(uxbar,'box-shadow','0 12px 28px rgba(0,0,0,.42),0 0 18px rgba(25,233,140,.08),inset 0 1px 0 rgba(255,255,255,.045)');
        imp(uxbar,'backdrop-filter','blur(14px) saturate(1.2)'); imp(uxbar,'-webkit-backdrop-filter','blur(14px) saturate(1.2)');
        var gesture=uxbar.querySelector('.gesture'); if(gesture){
          imp(gesture,'min-width','0'); imp(gesture,'overflow','hidden'); imp(gesture,'text-overflow','ellipsis'); imp(gesture,'white-space','nowrap');
          imp(gesture,'font-size','9.2px'); imp(gesture,'font-weight','1000'); imp(gesture,'letter-spacing','1.5px'); imp(gesture,'text-transform','uppercase'); imp(gesture,'color','rgba(207,224,230,.72)');
        }
        var reset=uxbar.querySelector('.chart-reset'); if(reset){
          imp(reset,'height','38px'); imp(reset,'min-width','82px'); imp(reset,'padding','0 10px'); imp(reset,'border-radius','14px');
          imp(reset,'font-size','10.5px'); imp(reset,'font-weight','950'); imp(reset,'letter-spacing','.3px'); imp(reset,'color','rgba(230,246,242,.82)');
          imp(reset,'background','linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025))'); imp(reset,'border','1px solid rgba(150,255,220,.14)');
        }
      }else{ imp(uxbar,'display','none'); }
    }
    tuneDockClasses(d);
    return true;
  }
  function patchInsideGame(){
    var w=child(), d=childDoc();
    if(!w||!d||!d.body) return false;
    if(!styleInjected && d.head){
      var st=d.createElement('style');
      st.setAttribute('data-candlerun-playnow-patch','v12.12-bottom-right-fs-hard-force');
      st.textContent=[
        '/* CandleRun V12.12: hard-force normal fullscreen button to the bottom-right chart control slot. */',
        '#patchBadge{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;}',
        'body:not(.fs-chart) #chart-host>.chart-fsbtn,body:not(.fs-chart) .chart-fsbtn{position:absolute!important;top:auto!important;bottom:12px!important;right:12px!important;left:auto!important;z-index:70!important;width:48px!important;height:43px!important;min-width:48px!important;min-height:43px!important;display:flex!important;align-items:center!important;justify-content:center!important;border-radius:16px!important;padding:0!important;color:#d9fff1!important;background:linear-gradient(180deg,rgba(16,39,43,.96),rgba(4,14,18,.90))!important;border:1px solid rgba(150,255,220,.38)!important;box-shadow:0 10px 22px rgba(0,0,0,.40),0 0 16px rgba(25,233,140,.15),inset 0 1px 0 rgba(255,255,255,.07)!important;pointer-events:auto!important;touch-action:manipulation!important;}',
        'body:not(.fs-chart) .chart-fsbtn svg{width:23px!important;height:23px!important;stroke:currentColor!important;}',
        'body:not(.fs-chart) .chart-uxbar{left:132px!important;right:66px!important;bottom:12px!important;top:auto!important;width:auto!important;max-width:none!important;z-index:60!important;display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;align-items:center!important;gap:7px!important;padding:6px 7px 6px 12px!important;border-radius:18px!important;background:linear-gradient(160deg,rgba(7,18,22,.82),rgba(2,8,12,.78))!important;border:1px solid rgba(150,255,220,.17)!important;box-shadow:0 12px 28px rgba(0,0,0,.42),0 0 18px rgba(25,233,140,.08),inset 0 1px 0 rgba(255,255,255,.045)!important;backdrop-filter:blur(14px) saturate(1.2)!important;-webkit-backdrop-filter:blur(14px) saturate(1.2)!important;}',
        'body:not(.fs-chart) .chart-uxbar .gesture{min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;font-size:9.2px!important;font-weight:1000!important;letter-spacing:1.5px!important;text-transform:uppercase!important;color:rgba(207,224,230,.72)!important;}',
        'body:not(.fs-chart) .chart-uxbar .chart-reset{height:38px!important;min-width:82px!important;padding:0 10px!important;border-radius:14px!important;font-size:10.5px!important;font-weight:950!important;letter-spacing:.3px!important;color:rgba(230,246,242,.82)!important;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025))!important;border:1px solid rgba(150,255,220,.14)!important;}',
        'body.fs-chart .chart-uxbar,body.fs-chart #chart-host>.chart-fsbtn,body.fs-chart .chart-fsbtn.dock-hidden-fsbtn{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;}',
        'body.fs-chart .fs-dock{left:10px!important;right:10px!important;bottom:calc(var(--safe-bot) + 12px)!important;z-index:40!important;min-height:0!important;overflow:hidden!important;padding:10px!important;border-radius:26px!important;background:linear-gradient(160deg,rgba(7,18,22,.93),rgba(2,7,11,.95) 62%,rgba(4,9,14,.98))!important;border:1px solid rgba(150,255,220,.20)!important;box-shadow:0 20px 54px rgba(0,0,0,.62),0 0 0 1px rgba(25,233,140,.05),0 0 28px rgba(25,233,140,.09),inset 0 1px 0 rgba(255,255,255,.06)!important;backdrop-filter:blur(18px) saturate(1.25)!important;-webkit-backdrop-filter:blur(18px) saturate(1.25)!important;}',
        'body.fs-chart .fs-dock.has-pos{display:grid!important;grid-template-columns:minmax(96px,.92fr) minmax(126px,1.12fr) 56px!important;grid-template-areas:"dir pnl pnl" "close be exit"!important;align-items:center!important;gap:8px!important;}',
        'body.fs-chart .fs-dock.has-pos .cd-dir{grid-area:dir!important;margin:0!important;min-height:34px!important;display:flex!important;align-items:center!important;justify-content:center!important;border-radius:14px!important;font-size:12px!important;letter-spacing:.7px!important;}',
        'body.fs-chart .fs-dock.has-pos .cd-pnl{grid-area:pnl!important;text-align:right!important;font-size:19px!important;font-weight:1000!important;line-height:1!important;}body.fs-chart .fs-dock.has-pos .fd-mk,body.fs-chart .fs-dock.has-pos .cd-r{display:none!important;}',
        'body.fs-chart .fs-dock.has-pos .cd-btn{margin:0!important;min-width:0!important;min-height:52px!important;height:52px!important;padding:0 12px!important;display:flex!important;align-items:center!important;justify-content:center!important;border-radius:18px!important;font-size:14px!important;font-weight:1000!important;letter-spacing:.35px!important;}',
        'body.fs-chart .fs-dock.has-pos .cd-btn.close{grid-area:close!important;width:100%!important;color:#260408!important;background:linear-gradient(180deg,#ff6f80 0%,#f04454 55%,#c92735 100%)!important;border:none!important;box-shadow:0 12px 28px rgba(255,77,94,.34),inset 0 1px 0 rgba(255,255,255,.22)!important;}body.fs-chart .fs-dock.has-pos .cd-btn.be{grid-area:be!important;width:100%!important;color:#dff7ff!important;background:linear-gradient(180deg,rgba(23,57,70,.92),rgba(8,24,32,.90))!important;border:1px solid rgba(110,215,255,.34)!important;}',
        'body.fs-chart .fs-dock .fsx.exit,body.fs-chart .fs-dock .fsx{grid-area:exit!important;width:56px!important;height:52px!important;min-width:56px!important;min-height:52px!important;max-width:56px!important;margin:0!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;border-radius:18px!important;color:#d9fff1!important;background:linear-gradient(180deg,rgba(16,38,43,.95),rgba(4,13,18,.90))!important;border:1px solid rgba(150,255,220,.36)!important;box-shadow:0 12px 26px rgba(0,0,0,.36),0 0 16px rgba(25,233,140,.12),inset 0 1px 0 rgba(255,255,255,.06)!important;}',
        'body.fs-chart .fs-dock .fsx.exit svg,body.fs-chart .fs-dock .fsx svg{width:23px!important;height:23px!important;stroke:currentColor!important;}',
        '@media(max-width:430px){body:not(.fs-chart) #chart-host>.chart-fsbtn,body:not(.fs-chart) .chart-fsbtn{bottom:11px!important;right:11px!important;width:46px!important;height:42px!important;min-width:46px!important;min-height:42px!important;border-radius:15px!important;}body:not(.fs-chart) .chart-uxbar{left:118px!important;right:62px!important;bottom:11px!important;padding:6px 6px 6px 10px!important;border-radius:17px!important;}body:not(.fs-chart) .chart-uxbar .gesture{font-size:8.6px!important;letter-spacing:1.25px!important;}body:not(.fs-chart) .chart-uxbar .chart-reset{min-width:76px!important;height:37px!important;font-size:10px!important;}body.fs-chart .fs-dock{left:9px!important;right:9px!important;bottom:calc(var(--safe-bot) + 10px)!important;padding:10px!important;border-radius:24px!important;}body.fs-chart .fs-dock.has-pos{grid-template-columns:minmax(98px,.92fr) minmax(118px,1.08fr) 54px!important;grid-template-areas:"dir pnl pnl" "close be exit"!important;}body.fs-chart .fs-dock .fsx.exit,body.fs-chart .fs-dock .fsx{width:54px!important;min-width:54px!important;max-width:54px!important;}}',
        '@media(max-width:370px){body:not(.fs-chart) .chart-uxbar{left:92px!important;right:58px!important;}body:not(.fs-chart) .chart-uxbar .gesture{max-width:80px!important;}body:not(.fs-chart) #chart-host>.chart-fsbtn,body:not(.fs-chart) .chart-fsbtn{right:10px!important;}}'
      ].join('\n');
      d.head.appendChild(st);
      styleInjected=true;
    }
    forceBottomRightFsButton();
    if(!listenerInjected){
      try{
        d.addEventListener('pointerdown',function(ev){
          var fsBtn=ev.target&&ev.target.closest&&ev.target.closest('.chart-fsbtn');
          var exitBtn=ev.target&&ev.target.closest&&ev.target.closest('.fs-dock .fsx');
          if(!fsBtn && !exitBtn) return;
          ev.preventDefault();
          ev.stopPropagation();
          try{
            if(typeof w.toggleChartFs==='function') w.toggleChartFs();
            else if(typeof w.handleAction==='function') w.handleAction('chart-fullscreen',{},fsBtn||exitBtn);
            setTimeout(forceBottomRightFsButton,15);
            if(typeof w.renderChart==='function') setTimeout(function(){try{w.renderChart();forceBottomRightFsButton();}catch(e){}},45);
          }catch(e){}
        },true);
        listenerInjected=true;
      }catch(e){}
    }
    if(!patchedRender && typeof w.renderChart==='function'){
      try{
        var src=String(w.renderChart);
        var next=src.replace(/var\s+futureSlots\s*=\s*[0-9.]+\s*;/,'var futureSlots=2.35;');
        if(next!==src){
          w.eval('renderChart = '+next);
          patchedRender=true;
          if(typeof w.renderChart==='function') w.renderChart();
        }
      }catch(e){}
    }
    if(!moStarted && d.body && w.MutationObserver){
      try{
        var mo=new w.MutationObserver(function(){ forceBottomRightFsButton(); });
        mo.observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style']});
        moStarted=true;
      }catch(e){}
    }
    forceBottomRightFsButton();
    return true;
  }
  frame.addEventListener('load',function(){
    setTimeout(function(){boot.classList.add('hide');},500);
    patchInsideGame();
    setTimeout(patchInsideGame,80);
    setTimeout(patchInsideGame,200);
    setTimeout(patchInsideGame,500);
    setTimeout(patchInsideGame,1000);
  });
  window.addEventListener('resize',patchInsideGame);
  window.addEventListener('orientationchange',function(){setTimeout(patchInsideGame,200);});
  setInterval(patchInsideGame,250);
})();
</script>
</body>
</html>
