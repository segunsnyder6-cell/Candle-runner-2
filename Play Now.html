<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04070b">
  <title>CandleRun — Play Now</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070b;color:#e9f2ef;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#04070b}
    #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(90% 55% at 50% 0%,rgba(25,233,140,.14),transparent 58%),#04070b;z-index:5;transition:opacity .25s ease}
    #boot.hide{opacity:0;pointer-events:none}
    .card{max-width:430px;border:1px solid rgba(120,255,205,.18);border-radius:26px;background:linear-gradient(160deg,rgba(16,28,39,.96),rgba(7,11,17,.98));padding:26px;box-shadow:0 22px 70px rgba(0,0,0,.55),0 0 40px rgba(25,233,140,.10);text-align:left}
    h1{margin:0;font-size:40px;line-height:.9;font-style:italic} h1 span{color:#19e98c;text-shadow:0 0 20px rgba(25,233,140,.35)}
    p{color:#9aa7ad;line-height:1.45;font-size:14px}.tiny{font-size:12px;color:#6f7d84}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:12px;padding:14px 18px;border-radius:16px;text-decoration:none;font-weight:900;border:1px solid rgba(120,255,205,.18);background:linear-gradient(180deg,#2bffaa,#10c87a);color:#02150f}
  </style>
</head>
<body>
  <iframe id="game" src="CandleRun%20V9%20GOAT%20Trading%20Game%205.html?v=fs-upper-right-v12-6" title="CandleRun Game"></iframe>
  <div id="boot"><div class="card"><h1>CANDLE<span>RUN</span></h1><p>Loading the clean Play Now build. Fullscreen/zoom-out is moved to the upper-right chart area you marked.</p><a class="btn" href="CandleRun%20V9%20GOAT%20Trading%20Game%205.html?v=fs-upper-right-v12-6">Open direct file if needed</a><p class="tiny">This page renders the game. GitHub's file list will still show code if you tap the file directly.</p></div></div>
<script>
(function(){
  var frame=document.getElementById('game');
  var boot=document.getElementById('boot');
  var styleInjected=false;
  var patchedRender=false;
  function child(){try{return frame.contentWindow;}catch(e){return null;}}
  function childDoc(){var w=child();try{return w&&w.document;}catch(e){return null;}}
  function findFsButton(d){return d.querySelector('button[data-act="chart-fullscreen"]')||d.querySelector('.chart-fsbtn');}
  function desiredFsPosition(w){
    var isFs=false;
    try{isFs=!!(w.document&&w.document.body&&w.document.body.classList.contains('fs-chart'));}catch(e){}
    return isFs ? {top:'72px',right:'98px',bottom:'auto'} : {top:'auto',right:'14px',bottom:'78px'};
  }
  function forceButtonPosition(w,btn){
    if(!btn) return;
    var pos=desiredFsPosition(w);
    btn.classList.add('cr-clean-fs');
    btn.style.setProperty('position','absolute','important');
    btn.style.setProperty('top',pos.top,'important');
    btn.style.setProperty('bottom',pos.bottom,'important');
    btn.style.setProperty('right',pos.right,'important');
    btn.style.setProperty('left','auto','important');
    btn.style.setProperty('width','32px','important');
    btn.style.setProperty('height','32px','important');
    btn.style.setProperty('border-radius','10px','important');
    btn.style.setProperty('z-index','250','important');
    btn.style.setProperty('pointer-events','auto','important');
    btn.style.setProperty('touch-action','manipulation','important');
    btn.style.setProperty('background','rgba(8,14,18,.72)','important');
    btn.style.setProperty('border','1px solid rgba(191,238,222,.32)','important');
    btn.style.setProperty('backdrop-filter','blur(9px)','important');
    btn.style.setProperty('box-shadow','0 6px 16px rgba(0,0,0,.34),0 0 12px rgba(25,233,140,.08)','important');
    var svg=btn.querySelector('svg');
    if(svg){svg.style.setProperty('width','16px','important');svg.style.setProperty('height','16px','important');svg.style.setProperty('stroke','#bfeede','important');svg.style.setProperty('pointer-events','none','important');}
  }
  function patchButton(w,d){
    var btn=findFsButton(d);
    if(!btn) return;
    forceButtonPosition(w,btn);
    if(btn.__crCleanFsPatched) return;
    btn.__crCleanFsPatched=true;
    var block=function(ev){ev.stopPropagation(); if(ev.stopImmediatePropagation) ev.stopImmediatePropagation();};
    var run=function(ev){
      ev.preventDefault(); ev.stopPropagation(); if(ev.stopImmediatePropagation) ev.stopImmediatePropagation();
      try{
        if(typeof w.toggleChartFs==='function') w.toggleChartFs();
        else if(typeof w.handleAction==='function') w.handleAction('chart-fullscreen',{},null);
        setTimeout(function(){try{if(typeof w.renderChart==='function') w.renderChart();}catch(e){}},40);
        setTimeout(function(){try{forceButtonPosition(w,findFsButton(d));}catch(e){}},70);
      }catch(e){}
    };
    ['pointerdown','touchstart','mousedown'].forEach(function(type){btn.addEventListener(type,block,true);});
    btn.addEventListener('click',run,true);
  }
  function patchInsideGame(){
    var w=child(), d=childDoc();
    if(!w||!d||!d.body) return false;
    if(!styleInjected && d.head){
      var st=d.createElement('style');
      st.setAttribute('data-candlerun-fs-upper-right','v12.6');
      st.textContent=[
        '#chart-host button[data-act="chart-fullscreen"],#chart-host .chart-fsbtn{position:absolute!important;z-index:250!important;width:32px!important;height:32px!important;border-radius:10px!important;background:rgba(8,14,18,.72)!important;border:1px solid rgba(191,238,222,.32)!important;backdrop-filter:blur(9px)!important;box-shadow:0 6px 16px rgba(0,0,0,.34),0 0 12px rgba(25,233,140,.08)!important;pointer-events:auto!important;touch-action:manipulation!important;}',
        'body:not(.fs-chart) #chart-host button[data-act="chart-fullscreen"],body:not(.fs-chart) #chart-host .chart-fsbtn{top:auto!important;bottom:78px!important;right:14px!important;left:auto!important;}',
        'body.fs-chart #chart-host button[data-act="chart-fullscreen"],body.fs-chart #chart-host .chart-fsbtn{top:72px!important;bottom:auto!important;right:98px!important;left:auto!important;}',
        '#chart-host button[data-act="chart-fullscreen"] svg,#chart-host .chart-fsbtn svg{width:16px!important;height:16px!important;stroke:#bfeede!important;pointer-events:none!important;}',
        '@media(max-width:430px){body.fs-chart #chart-host button[data-act="chart-fullscreen"],body.fs-chart #chart-host .chart-fsbtn{top:72px!important;right:98px!important;}body:not(.fs-chart) #chart-host button[data-act="chart-fullscreen"],body:not(.fs-chart) #chart-host .chart-fsbtn{bottom:78px!important;right:14px!important;}}'
      ].join('\n');
      d.head.appendChild(st);
      styleInjected=true;
    }
    if(!patchedRender && typeof w.renderChart==='function'){
      try{
        var src=String(w.renderChart);
        var next=src.replace(/var\s+futureSlots\s*=\s*[0-9.]+\s*;/,'var futureSlots=2.35;');
        if(next!==src){w.eval('renderChart = '+next);patchedRender=true;if(typeof w.renderChart==='function')w.renderChart();}
      }catch(e){}
    }
    patchButton(w,d);
    return true;
  }
  frame.addEventListener('load',function(){setTimeout(function(){boot.classList.add('hide');},450);patchInsideGame();});
  window.addEventListener('resize',patchInsideGame);
  window.addEventListener('orientationchange',function(){setTimeout(patchInsideGame,250);});
  setInterval(patchInsideGame,160);
})();
</script>
</body>
</html>
